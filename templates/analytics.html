<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Gemlaunch.fun</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .analytics-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .analytics-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .analytics-header h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .analytics-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .bubbles-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .placeholder-content {
            text-align: center;
            color: #CCCCCC;
        }
        
        .placeholder-content i {
            font-size: 4rem;
            color: #20B2AA;
            margin-bottom: 1rem;
        }
        
        .placeholder-content h3 {
            color: #FFFFFF;
            margin-bottom: 1rem;
        }
        
        .coming-soon-badge {
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Animated background with particles -->
    <div class="bg-animation" id="particles-js"></div>
    <div class="floating-elements"></div>

    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <div>
                    <img src="{{ url_for('static', filename='images/gemmy.png') }}" alt="Gemmy" class="gemmy-nav" style="height: 35px; width: auto; margin-right: 10px;">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Gemlaunch.fun Logo" class="logo-image">
                </div>
                <div>
                    <a href="/analytics" class="nav-link active">Analytics</a>
                    <a href="/" class="nav-link">Home</a>
                    <a href="/app" class="nav-link">App</a>
                    <a href="/docs" class="nav-link">Documentation</a>
                    <a href="https://t.me/gemlaunchio" class="nav-link"><i class="fab fa-telegram"></i></a>
                    <a href="https://x.com/Gemlaunch_fun" class="nav-link"><i class="fab fa-twitter"></i></a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Analytics Main -->
    <main class="analytics-main">
        <div class="analytics-content">
            <div class="analytics-header">
                <h1>Analytics Dashboard</h1>
                <p>Real-time insights and bubble chart trading for Kaspa memecoins</p>
            </div>

            <!-- Bubbles Chart Container -->
            <div class="bubbles-container">
                <div class="placeholder-content">
                    <span class="coming-soon-badge">Coming Soon</span>
                    <i class="fas fa-chart-bubble"></i>
                    <h3>Interactive Bubble Chart</h3>
                    <p>Trade directly from bubbles showing real-time token performance</p>
                    <p>Market cap visualization • Volume indicators • Price movements</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

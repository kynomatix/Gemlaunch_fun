{% extends "app/htmx_layout.html" %}

{% block extra_head %}
<style>
        /* Leaderboard Container */
        .leaderboard-container {
            padding-top: 100px;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }
        
        .leaderboard-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .leaderboard-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .leaderboard-subtitle {
            color: #CCCCCC;
            font-size: 1.1rem;
        }
        
        .leaderboard-grid {
            display: grid;
            gap: 2rem;
        }
        
        /* Rank Card */
        .rank-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .user-rank-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.05));
            border-color: rgba(255, 215, 0, 0.3);
        }
        
        .rank-header {
            margin-bottom: 1.5rem;
        }
        
        .rank-header h3 {
            color: #FFFFFF;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .rank-position {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .rank-number {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }
        
        .rank-label {
            color: #CCCCCC;
            font-size: 0.9rem;
            display: block;
            margin-top: 0.5rem;
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        .user-stats .stat {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 10px;
        }
        
        .user-stats .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 0.25rem;
        }
        
        .user-stats .stat-label {
            display: block;
            color: #CCCCCC;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        
        /* Rankings Section */
        .rankings-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }
        
        .section-header h3 {
            color: #FFFFFF;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .season-info {
            background: rgba(255, 215, 0, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            color: #FFD700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Rankings Table */
        .rankings-table {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .rank-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1rem;
            display: grid;
            grid-template-columns: 60px 1fr auto;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        .rank-row:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .rank-row.current-user {
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.1), rgba(0, 206, 209, 0.05));
            border-color: rgba(32, 178, 170, 0.3);
        }
        
        .rank-row.top-three {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.05));
            border-color: rgba(255, 215, 0, 0.3);
        }
        
        .rank-position-display {
            text-align: center;
            font-size: 1.5rem;
        }
        
        .rank-position-display .gold {
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .rank-position-display .silver {
            color: #C0C0C0;
            text-shadow: 0 0 20px rgba(192, 192, 192, 0.5);
        }
        
        .rank-position-display .bronze {
            color: #CD7F32;
            text-shadow: 0 0 20px rgba(205, 127, 50, 0.5);
        }
        
        .rank-num {
            color: #CCCCCC;
            font-weight: 600;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 215, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .default-avatar {
            color: #FFD700;
            font-size: 1.5rem;
        }
        
        .user-details {
            display: flex;
            flex-direction: column;
        }
        
        .username {
            color: #FFFFFF;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .wallet-short {
            color: #999999;
            font-size: 0.85rem;
        }
        
        .user-stats-row {
            display: flex;
            gap: 2rem;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-item .stat-value {
            display: block;
            color: #FFD700;
            font-weight: 700;
            font-size: 1rem;
        }
        
        .stat-item .stat-label {
            display: block;
            color: #999999;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        
        /* Competition Section */
        .competition-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .reward-tier {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .reward-tier:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .reward-tier.gold-tier {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 165, 0, 0.1));
            border-color: rgba(255, 215, 0, 0.4);
        }
        
        .reward-tier.silver-tier {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(169, 169, 169, 0.1));
            border-color: rgba(192, 192, 192, 0.4);
        }
        
        .reward-tier.bronze-tier {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), rgba(184, 115, 51, 0.1));
            border-color: rgba(205, 127, 50, 0.4);
        }
        
        .tier-badge {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #FFD700;
        }
        
        .tier-rewards {
            color: #FFFFFF;
        }
        
        .reward-amount {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .reward-extras {
            color: #CCCCCC;
            font-size: 0.9rem;
        }
        
        .info-box {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #CCCCCC;
        }
        
        .info-box i {
            color: #20B2AA;
            font-size: 1.5rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .rank-row {
                grid-template-columns: 50px 1fr;
            }
            
            .user-stats-row {
                display: none;
            }
            
            .section-header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .rewards-grid {
                grid-template-columns: 1fr;
            }
        }
</style>
{% endblock %}

{% block content %}
{% include 'app/leaderboard_content_inc.html' %}
{% endblock %}

{% block extra_scripts %}
<script>
// Leaderboard-specific functionality
(function() {
    // Initialize animations
    function initializeAnimations() {
        const rankRows = document.querySelectorAll('.rank-row');
        rankRows.forEach((row, index) => {
            row.style.opacity = '0';
            row.style.transform = 'translateX(-20px)';
            
            setTimeout(() => {
                row.style.transition = 'all 0.5s ease';
                row.style.opacity = '1';
                row.style.transform = 'translateX(0)';
            }, index * 50);
        });
        
        // Animate reward tiers
        const rewardTiers = document.querySelectorAll('.reward-tier');
        rewardTiers.forEach((tier, index) => {
            tier.style.opacity = '0';
            tier.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                tier.style.transition = 'all 0.5s ease';
                tier.style.opacity = '1';
                tier.style.transform = 'translateY(0)';
            }, 500 + index * 100);
        });
    }
    
    // Initialize counter animations
    function animateCounters() {
        const counters = document.querySelectorAll('.stat-value');
        counters.forEach(counter => {
            const target = parseInt(counter.innerText.replace(/[^0-9]/g, ''));
            if (!isNaN(target) && target > 0) {
                let current = 0;
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        counter.innerText = counter.innerText; // Keep original formatting
                        clearInterval(timer);
                    } else {
                        counter.innerText = Math.ceil(current).toLocaleString();
                    }
                }, 20);
            }
        });
    }
    
    // Initialize everything
    initializeAnimations();
    // Delay counter animation slightly
    setTimeout(animateCounters, 300);
    
    // Export for re-initialization after HTMX swaps
    window.initializeLeaderboardScripts = function() {
        initializeAnimations();
        setTimeout(animateCounters, 300);
    };
})();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet - Gemlaunch.fun</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .connect-main {
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .connect-container {
            max-width: 500px;
            width: 100%;
            margin: 2rem;
        }
        
        .connect-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .connect-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .wallet-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .wallet-button {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            color: #FFFFFF;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }
        
        .wallet-button:hover {
            transform: translateY(-3px);
            border-color: rgba(32, 178, 170, 0.5);
            box-shadow: 0 10px 30px rgba(32, 178, 170, 0.2);
            text-decoration: none;
            color: #FFFFFF;
        }
        
        .wallet-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        
        .wallet-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1.2rem;
            color: #20B2AA;
        }
        
        .wallet-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #CCCCCC;
        }
        
        .kastle-icon {
            background: linear-gradient(135deg, #7B68EE, #9370DB);
        }
        
        .metamask-icon {
            background: linear-gradient(135deg, #F6851B, #E2761B);
        }
        
        .connecting {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .error-message {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            color: #FF3232;
            text-align: center;
        }
        
        .network-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .network-info h4 {
            color: #20B2AA;
            margin: 0 0 0.5rem 0;
        }
        
        .network-info p {
            color: #CCCCCC;
            margin: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Animated background with particles -->
    <div class="bg-animation" id="particles-js"></div>
    <div class="floating-elements"></div>

    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <div>
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Gemlaunch.fun Logo" class="logo-image">
                </div>
                <div>
                    <a href="/" class="nav-link">Home</a>
                    <a href="/app/tokens" class="nav-link">Marketplace</a>
                    <a href="/docs" class="nav-link">Documentation</a>
                    <a href="https://t.me/gemlaunchio" class="nav-link"><i class="fab fa-telegram"></i></a>
                    <a href="https://x.com/Gemlaunch_fun" class="nav-link"><i class="fab fa-twitter"></i></a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Connect Wallet Main -->
    <main class="connect-main">
        <div class="connect-container">
            <div class="connect-header">
                <h1>Connect Your Wallet</h1>
                <p>Connect your Kaspa wallet to start creating and trading memecoins</p>
            </div>

            <!-- Network Info -->
            <div class="network-info">
                <h4>⚡ Kasplex Testnet</h4>
                <p>Make sure your wallet is connected to the Kasplex testnet for testing</p>
            </div>

            <!-- Error Message (hidden by default) -->
            <div id="error-message" class="error-message" style="display: none;">
                <p id="error-text"></p>
            </div>

            <!-- Wallet Options -->
            <div class="wallet-options">
                <button class="wallet-button" onclick="connectKastle()">
                    <div class="wallet-icon kastle-icon">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <div class="wallet-info">
                        <h3>Kastle Wallet</h3>
                        <p>Native Kaspa wallet with full Kasplex support</p>
                    </div>
                </button>

                <button class="wallet-button" onclick="connectMetaMask()">
                    <div class="wallet-icon metamask-icon">
                        <i class="fab fa-ethereum"></i>
                    </div>
                    <div class="wallet-info">
                        <h3>MetaMask</h3>
                        <p>Popular wallet with Kasplex integration</p>
                    </div>
                </button>
            </div>

            <!-- Instructions -->
            <div style="text-align: center; margin-top: 2rem; color: #CCCCCC; font-size: 0.9rem;">
                <p>Don't have a wallet? Download <a href="https://kastle.cash" target="_blank" style="color: #20B2AA;">Kastle Wallet</a> or <a href="https://metamask.io" target="_blank" style="color: #20B2AA;">MetaMask</a></p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/4.15.0/web3.min.js"></script>
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
        // Kasplex zkEVM Testnet Configuration
        const KASPLEX_TESTNET = {
            chainId: '0x2A', // Chain ID for Kasplex testnet (42 in decimal)
            chainName: 'Kasplex zkEVM Testnet',
            nativeCurrency: {
                name: 'KAS',
                symbol: 'KAS',
                decimals: 18
            },
            rpcUrls: ['https://rpc-testnet.kasplex.org'],
            blockExplorerUrls: ['https://explorer-testnet.kasplex.org']
        };
        
        // Wallet connection functions
        async function connectKastle() {
            try {
                showConnecting('Kastle Wallet');
                
                // Check if Kastle wallet is available (using Kasplex Kiwi SDK integration)
                if (typeof window.kastle === 'undefined' && typeof window.kasware === 'undefined') {
                    // Fallback: try to load Kasplex SDK
                    try {
                        await loadKasplexSDK();
                        const wallet = await connectNativeKaspa();
                        if (wallet && wallet.address) {
                            await connectWallet(wallet.address, 'kastle');
                            return;
                        }
                    } catch (sdkError) {
                        console.error('Kasplex SDK error:', sdkError);
                    }
                    throw new Error('Kastle wallet not found. Please install Kastle wallet or Kasware.');
                }
                
                // Try Kastle wallet first
                let accounts = null;
                if (typeof window.kastle !== 'undefined') {
                    accounts = await window.kastle.request({
                        method: 'kas_requestAccounts'
                    });
                } else if (typeof window.kasware !== 'undefined') {
                    // Fallback to Kasware
                    accounts = await window.kasware.requestAccounts();
                }
                
                if (accounts && accounts.length > 0) {
                    const walletAddress = accounts[0];
                    await connectWallet(walletAddress, 'kastle');
                } else {
                    throw new Error('No accounts found in Kaspa wallet');
                }
                
            } catch (error) {
                console.error('Kastle connection error:', error);
                showError(error.message || 'Failed to connect to Kastle wallet');
                hideConnecting();
            }
        }
        
        async function connectMetaMask() {
            try {
                showConnecting('MetaMask');
                
                // Check if MetaMask is available
                if (typeof window.ethereum === 'undefined') {
                    throw new Error('MetaMask not found. Please install MetaMask.');
                }
                
                // Try to add Kasplex network to MetaMask
                try {
                    await addKasplexNetwork();
                } catch (networkError) {
                    console.warn('Failed to add Kasplex network:', networkError);
                    // Continue anyway - user might have network already
                }
                
                // Request wallet connection
                const accounts = await window.ethereum.request({
                    method: 'eth_requestAccounts'
                });
                
                if (accounts && accounts.length > 0) {
                    // Switch to Kasplex network
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: KASPLEX_TESTNET.chainId }],
                        });
                    } catch (switchError) {
                        console.warn('Failed to switch to Kasplex network:', switchError);
                    }
                    
                    const walletAddress = accounts[0];
                    await connectWallet(walletAddress, 'metamask');
                } else {
                    throw new Error('No accounts found in MetaMask');
                }
                
            } catch (error) {
                console.error('MetaMask connection error:', error);
                showError(error.message || 'Failed to connect to MetaMask');
                hideConnecting();
            }
        }
        
        // Add Kasplex network to MetaMask
        async function addKasplexNetwork() {
            try {
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [KASPLEX_TESTNET]
                });
                console.log('Kasplex network added successfully');
            } catch (error) {
                if (error.code === 4902) {
                    console.log('Kasplex network already exists');
                } else {
                    throw error;
                }
            }
        }
        
        // Native Kaspa connection using Kasplex SDK
        async function loadKasplexSDK() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/@kasplex/kiwi-web@latest/dist/kiwi-web.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        async function connectNativeKaspa() {
            try {
                // This is a simplified version - actual implementation would depend on the SDK
                if (typeof window.Kiwi !== 'undefined') {
                    // Initialize Kasplex SDK
                    const kiwi = new window.Kiwi();
                    await kiwi.connect('testnet');
                    
                    // Get wallet address
                    const wallet = await kiwi.getWallet();
                    return { address: wallet.address };
                }
                throw new Error('Kasplex SDK not available');
            } catch (error) {
                console.error('Native Kaspa connection error:', error);
                throw error;
            }
        }
        
        async function connectWallet(walletAddress, walletType) {
            try {
                const response = await fetch('/api/connect-wallet', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        wallet_address: walletAddress,
                        wallet_type: walletType
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Redirect to dashboard
                    window.location.href = '/app';
                } else {
                    throw new Error(data.error || 'Failed to connect wallet');
                }
                
            } catch (error) {
                console.error('Wallet connection error:', error);
                showError(error.message || 'Failed to connect wallet');
                hideConnecting();
            }
        }
        
        function showConnecting(walletName) {
            const buttons = document.querySelectorAll('.wallet-button');
            buttons.forEach(btn => btn.classList.add('connecting'));
            
            // Update button text
            const activeButton = event.target.closest('.wallet-button');
            const walletInfo = activeButton.querySelector('.wallet-info p');
            walletInfo.textContent = `Connecting to ${walletName}...`;
        }
        
        function hideConnecting() {
            const buttons = document.querySelectorAll('.wallet-button');
            buttons.forEach(btn => btn.classList.remove('connecting'));
            
            // Reset button text
            document.querySelector('.kastle-icon').closest('.wallet-button').querySelector('.wallet-info p').textContent = 'Native Kaspa wallet with full Kasplex support';
            document.querySelector('.metamask-icon').closest('.wallet-button').querySelector('.wallet-info p').textContent = 'Popular wallet with Kasplex integration';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }
        
        // Hide error when user clicks wallet buttons
        document.querySelectorAll('.wallet-button').forEach(btn => {
            btn.addEventListener('click', hideError);
        });
    </script>
</body>
</html>

<!-- HTMX Layout - Only content, no sidebar/topbar -->
{% block extra_head %}{% endblock %}

{% block content %}{% endblock %}

{% block extra_scripts %}{% endblock %}

<script>
// Re-initialize page-specific functionality after HTMX swap
(function() {
    // Call any page initialization functions
    if (typeof initializePageScripts === 'function') {
        initializePageScripts();
    }
    
    // Dashboard-specific initializations
    if (document.querySelector('.dashboard-header')) {
        // Tab switching for dashboard
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });
        
        // Initialize animations
        const achievementItems = document.querySelectorAll('.accolade-item');
        achievementItems.forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                item.style.transition = 'all 0.5s ease';
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, index * 100);
        });
    }
    
    // Profile-specific initializations
    if (document.querySelector('.profile-container')) {
        // Profile tabs
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            const btn = document.querySelector(`[onclick="switchTab('${tabName}')"]`);
            if (btn) btn.classList.add('active');
            const tab = document.getElementById(`${tabName}-tab`);
            if (tab) tab.classList.add('active');
        };
    }
})();
</script>

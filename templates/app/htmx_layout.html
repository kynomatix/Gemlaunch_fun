<!-- HTMX Layout - Only content, no sidebar/topbar -->
{% block extra_head %}{% endblock %}

{% block content %}{% endblock %}

{% block extra_scripts %}{% endblock %}

<script>
// Re-initialize page-specific functionality after HTMX swap
function reinitializePageScripts() {
    // Dashboard-specific initializations
    if (document.querySelector('.dashboard-header')) {
        // Dashboard.js handles its own initialization
        if (typeof window.initializeDashboard === 'function') {
            window.initializeDashboard();
        }
    }
    
    // Marketplace-specific initializations
    if (document.querySelector('.marketplace-main')) {
        if (typeof initializeMarketplaceScripts === 'function') {
            initializeMarketplaceScripts();
        }
    }
    
    // Create Token-specific initializations
    if (document.querySelector('.create-main')) {
        if (typeof initializeCreateTokenScripts === 'function') {
            initializeCreateTokenScripts();
        }
    }
    
    // Leaderboard-specific initializations
    if (document.querySelector('.leaderboard-container')) {
        if (typeof initializeLeaderboardScripts === 'function') {
            initializeLeaderboardScripts();
        }
    }
    
    // Profile-specific initializations
    if (document.querySelector('.profile-container')) {
        if (typeof initializeProfileScripts === 'function') {
            initializeProfileScripts();
        }
    }
}

// Run initialization immediately
reinitializePageScripts();

// Also run initialization after HTMX swaps
if (typeof htmx !== 'undefined') {
    document.body.addEventListener('htmx:afterSwap', function(event) {
        // Small delay to ensure DOM is ready
        setTimeout(reinitializePageScripts, 50);
    });
    
    document.body.addEventListener('htmx:afterSettle', function(event) {
        // Additional initialization after animations complete
        reinitializePageScripts();
    });
}
</script>

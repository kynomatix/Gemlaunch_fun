<!-- Trade Panel Partial -->
<div class="trade-panel">
    <div class="trade-tabs">
        <button class="trade-tab buy active" onclick="setTradeMode('buy')">Buy</button>
        <button class="trade-tab sell" onclick="setTradeMode('sell')">Sell</button>
    </div>
    
    <div class="trade-form">
        <div class="input-group">
            <label>You Pay (KAS)</label>
            <input type="number" id="kasAmount" placeholder="0.0" step="0.000001">
            <span class="input-addon">${{ "%.2f"|format(0) }} USD</span>
        </div>
        
        <div class="quick-amounts">
            <button class="quick-amount" onclick="setQuickAmount(10)">10 KAS</button>
            <button class="quick-amount" onclick="setQuickAmount(50)">50 KAS</button>
            <button class="quick-amount" onclick="setQuickAmount(100)">100 KAS</button>
            <button class="quick-amount" onclick="setQuickAmount(500)">500 KAS</button>
        </div>
        
        <div class="input-group">
            <label>You Receive ({{ token.symbol }})</label>
            <input type="number" id="tokenAmount" placeholder="0" readonly>
        </div>
        
        <button class="trade-button buy" id="tradeButton" onclick="executeTrade()">
            <i class="fas fa-rocket"></i> Buy ${{ token.symbol }}
        </button>
    </div>
</div>

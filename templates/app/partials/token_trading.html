<!-- Trade Panel Partial -->
<div class="trade-panel">
    <div class="trade-tabs">
        <button class="trade-tab buy active" onclick="setTradeMode('buy')">Buy</button>
        <button class="trade-tab sell" onclick="setTradeMode('sell')">Sell</button>
    </div>
    
    <div class="trade-form">
        <div class="input-group">
            <label id="kasAmountLabel">You Pay (KAS)</label>
            <input type="number" id="kasAmount" placeholder="0.0" step="0.000001">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.25rem;">
                <span class="input-addon" id="kasUsdValue" style="font-size: 0.75rem;">${{ "%.2f"|format(0) }} USD</span>
                <span id="kasBalanceDisplay" style="font-size: 0.75rem; color: #888;">Balance: -- KAS</span>
            </div>
        </div>
        
        <div id="quickAmountsContainer" class="quick-amounts">
            <!-- Dynamic buttons populated by JS based on mode -->
        </div>
        
        <div class="input-group">
            <label id="tokenAmountLabel">You Receive ({{ token.symbol }})</label>
            <input type="number" id="tokenAmount" placeholder="0" step="1">
            <span id="tokenBalanceDisplay" style="font-size: 0.75rem; color: #888; display: block; margin-top: 0.25rem;">Balance: -- {{ token.symbol }}</span>
        </div>
        
        <!-- Fee Breakdown Section (Phase 3.3 Step 2 - Spec Compliant) -->
        <div id="feeBreakdown" class="fee-breakdown" style="display: none;">
            <div class="fee-header">Fee Breakdown</div>
            
            <!-- Prominent Fees (Always Visible) -->
            <div class="fee-item fee-impact">
                <span>Price Impact:</span>
                <span id="priceImpactDisplay">0%</span>
            </div>
            <div class="fee-item">
                <span>Auto Slippage:</span>
                <span id="autoSlippageDisplay">0.50%</span>
            </div>
            
            <!-- Collapsible Platform Fee Breakdown -->
            <div class="platform-fee-toggle" onclick="togglePlatformFees()">
                <span><i class="fas fa-chevron-right" id="platformFeeChevron"></i> Platform Fee Breakdown</span>
                <span id="totalPlatformFee">0 KAS</span>
            </div>
            <div id="platformFeeDetails" class="platform-fee-details" style="display: none;">
                <div class="fee-item fee-sub">
                    <span>Platform Fee (0.9%):</span>
                    <span id="platformFeeDisplay">0 KAS</span>
                </div>
                <div class="fee-item fee-sub">
                    <span>Creator Fee (0.1%):</span>
                    <span id="creatorFeeDisplay">0 KAS</span>
                </div>
                <div class="fee-item fee-sub">
                    <span>Anti-Bot Fee:</span>
                    <span id="antiBotFeeDisplay">0 KAS</span>
                </div>
            </div>
        </div>
        
        <!-- Trade Status -->
        <div id="tradeStatus" style="display: none;"></div>
        
        <button type="button" class="trade-button buy" id="tradeButton" onclick="executeTrade()">
            <i class="fas fa-rocket"></i> Buy ${{ token.symbol }}
        </button>
    </div>
</div>

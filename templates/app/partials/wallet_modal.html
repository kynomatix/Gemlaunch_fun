<style>
    .wallet-modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        animation: fadeIn 0.3s ease;
    }
    
    .wallet-modal-overlay.active {
        display: flex;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
    
    .wallet-modal-card {
        background: rgba(13, 13, 13, 0.95);
        border: 1px solid rgba(32, 178, 170, 0.3);
        border-radius: 15px;
        max-width: 500px;
        width: 100%;
        padding: 2rem;
        position: relative;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
        from {
            transform: translateY(30px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    .wallet-modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(32, 178, 170, 0.2);
        border-radius: 8px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #CCCCCC;
        font-size: 1.2rem;
    }
    
    .wallet-modal-close:hover {
        background: rgba(255, 50, 50, 0.2);
        border-color: rgba(255, 50, 50, 0.5);
        color: #FF3232;
        transform: rotate(90deg);
    }
    
    .wallet-modal-header {
        text-align: center;
        margin-bottom: 2rem;
        padding-right: 2rem;
    }
    
    .wallet-modal-header h2 {
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
    }
    
    .wallet-modal-header p {
        color: #CCCCCC;
        font-size: 0.95rem;
        margin: 0;
    }
    
    .wallet-modal-status {
        display: none;
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 500;
    }
    
    .wallet-modal-status.active {
        display: block;
    }
    
    .wallet-modal-status.connecting {
        background: rgba(32, 178, 170, 0.1);
        border: 1px solid rgba(32, 178, 170, 0.3);
        color: #20B2AA;
    }
    
    .wallet-modal-status.error {
        background: rgba(255, 50, 50, 0.1);
        border: 1px solid rgba(255, 50, 50, 0.3);
        color: #FF3232;
    }
    
    .wallet-modal-status.success {
        background: rgba(0, 255, 100, 0.1);
        border: 1px solid rgba(0, 255, 100, 0.3);
        color: #00FF64;
    }
    
    .wallet-modal-options {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    
    .wallet-option-button {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(32, 178, 170, 0.2);
        border-radius: 10px;
        color: #FFFFFF;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(20px);
        width: 100%;
        text-align: left;
    }
    
    .wallet-option-button:hover {
        transform: translateY(-3px);
        border-color: rgba(32, 178, 170, 0.5);
        box-shadow: 0 10px 30px rgba(32, 178, 170, 0.2);
        background: rgba(255, 255, 255, 0.08);
    }
    
    .wallet-option-button:active {
        transform: translateY(-1px);
    }
    
    .wallet-option-button.connecting {
        opacity: 0.5;
        pointer-events: none;
    }
    
    .wallet-option-icon {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        flex-shrink: 0;
    }
    
    .wallet-option-icon.kastle {
        background: linear-gradient(135deg, #7B68EE, #9370DB);
    }
    
    .wallet-option-icon.kasware {
        background: linear-gradient(135deg, #F6851B, #E2761B);
    }
    
    .wallet-option-icon.metamask {
        background: linear-gradient(135deg, #F6851B, #E2761B);
    }
    
    .wallet-option-info {
        flex: 1;
    }
    
    .wallet-option-info h3 {
        margin: 0 0 0.25rem 0;
        font-size: 1.2rem;
        color: #20B2AA;
        font-weight: 600;
    }
    
    .wallet-option-info p {
        margin: 0;
        font-size: 0.9rem;
        color: #CCCCCC;
        line-height: 1.4;
    }
    
    @media (max-width: 768px) {
        .wallet-modal-card {
            padding: 1.5rem;
            margin: 1rem;
        }
        
        .wallet-modal-header h2 {
            font-size: 1.5rem;
        }
        
        .wallet-option-button {
            padding: 1.25rem;
        }
        
        .wallet-option-icon {
            width: 40px;
            height: 40px;
            font-size: 1.25rem;
        }
        
        .wallet-option-info h3 {
            font-size: 1.1rem;
        }
        
        .wallet-option-info p {
            font-size: 0.85rem;
        }
    }
</style>

<div id="walletModal" class="wallet-modal-overlay">
    <div class="wallet-modal-card">
        <button class="wallet-modal-close" onclick="closeWalletModal()">
            <i class="fas fa-times"></i>
        </button>
        
        <div class="wallet-modal-header">
            <h2>Connect Wallet</h2>
            <p>Choose your preferred wallet to connect</p>
        </div>
        
        <div id="walletModalStatus" class="wallet-modal-status">
            <span id="walletModalStatusText"></span>
        </div>
        
        <div class="wallet-modal-options">
            <button class="wallet-option-button" onclick="connectWalletFromModal('kastle')">
                <div class="wallet-option-icon kastle">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="wallet-option-info">
                    <h3>Kastle Wallet</h3>
                    <p>Native Kaspa wallet with full Kasplex support</p>
                </div>
            </button>
            
            <button class="wallet-option-button" onclick="connectWalletFromModal('kasware')">
                <div class="wallet-option-icon kasware">
                    <i class="fas fa-cube"></i>
                </div>
                <div class="wallet-option-info">
                    <h3>KasWare</h3>
                    <p>Kaspa wallet browser extension</p>
                </div>
            </button>
            
            <button class="wallet-option-button" onclick="connectWalletFromModal('metamask')">
                <div class="wallet-option-icon metamask">
                    <i class="fab fa-ethereum"></i>
                </div>
                <div class="wallet-option-info">
                    <h3>MetaMask</h3>
                    <p>EVM wallet - works on any network</p>
                </div>
            </button>
        </div>
    </div>
</div>

<script>
function openWalletModal() {
    const modal = document.getElementById('walletModal');
    if (modal) {
        modal.classList.add('active');
        resetWalletModalStatus();
    }
}

function closeWalletModal() {
    const modal = document.getElementById('walletModal');
    if (modal) {
        modal.classList.remove('active');
        resetWalletModalStatus();
    }
}

function resetWalletModalStatus() {
    const status = document.getElementById('walletModalStatus');
    if (status) {
        status.classList.remove('active', 'connecting', 'error', 'success');
        status.querySelector('#walletModalStatusText').textContent = '';
    }
    
    document.querySelectorAll('.wallet-option-button').forEach(btn => {
        btn.classList.remove('connecting');
    });
}

function setWalletModalStatus(message, type = 'connecting') {
    const status = document.getElementById('walletModalStatus');
    const statusText = document.getElementById('walletModalStatusText');
    
    if (status && statusText) {
        status.classList.remove('connecting', 'error', 'success');
        status.classList.add('active', type);
        statusText.textContent = message;
    }
}

async function connectWalletFromModal(walletType) {
    try {
        document.querySelectorAll('.wallet-option-button').forEach(btn => {
            btn.classList.add('connecting');
        });
        
        setWalletModalStatus(`Connecting to ${walletType === 'kastle' ? 'Kastle Wallet' : walletType === 'kasware' ? 'KasWare' : 'MetaMask'}...`, 'connecting');
        
        if (typeof WalletManager !== 'undefined') {
            const walletManager = new WalletManager();
            await walletManager.connectWallet(walletType);
            
            setWalletModalStatus('Connected successfully!', 'success');
            
            setTimeout(() => {
                closeWalletModal();
            }, 1500);
        } else if (typeof window.walletManager !== 'undefined') {
            await window.walletManager.connectWallet(walletType);
            
            setWalletModalStatus('Connected successfully!', 'success');
            
            setTimeout(() => {
                closeWalletModal();
            }, 1500);
        } else {
            throw new Error('WalletManager not found');
        }
    } catch (error) {
        console.error('Wallet connection error:', error);
        setWalletModalStatus(error.message || 'Failed to connect wallet', 'error');
        
        document.querySelectorAll('.wallet-option-button').forEach(btn => {
            btn.classList.remove('connecting');
        });
    }
}

document.addEventListener('click', function(e) {
    const modal = document.getElementById('walletModal');
    if (e.target === modal) {
        closeWalletModal();
    }
});
</script>

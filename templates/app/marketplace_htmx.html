{% extends "app/htmx_layout.html" %}

{% block extra_head %}
<style>
        .marketplace-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .marketplace-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .marketplace-header h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .filters {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 0.75rem;
            margin: 0 auto 2rem auto;
            max-width: 800px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 0.75rem 1.25rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #CCCCCC;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            position: relative;
        }
        
        .filter-btn:hover {
            background: rgba(32, 178, 170, 0.1);
            color: #20B2AA;
            transform: translateY(-1px);
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000000;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(32, 178, 170, 0.3);
        }
        
        .tokens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        /* Marketplace Token Type Badges */
        .token-info-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        
        .marketplace-token-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        
        .marketplace-token-badge.basic {
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.15), rgba(0, 206, 209, 0.08));
            border: 1px solid rgba(32, 178, 170, 0.3);
            color: #20B2AA;
        }
        
        .marketplace-token-badge.advanced {
            background: linear-gradient(135deg, rgba(74, 144, 184, 0.2), rgba(46, 139, 155, 0.1));
            border: 1px solid rgba(74, 144, 184, 0.4);
            color: #4A90B8;
            animation: subtle-glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes subtle-glow {
            from { box-shadow: 0 0 3px rgba(74, 144, 184, 0.2); }
            to { box-shadow: 0 0 8px rgba(74, 144, 184, 0.4); }
        }
        
        .contract-address-small {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            color: #999999;
            margin-top: 0.25rem;
            opacity: 0.8;
        }
        
        .contract-address-small i {
            font-size: 0.65rem;
        }
        
        .token-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .token-card:hover {
            transform: translateY(-5px);
            border-color: #20B2AA;
            box-shadow: 0 10px 30px rgba(32, 178, 170, 0.2);
        }
        
        .token-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .token-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
        }
        
        .token-info h3 {
            margin: 0;
            color: #FFFFFF;
            font-size: 1.2rem;
        }
        
        .token-info p {
            margin: 0;
            color: #CCCCCC;
            font-size: 0.9rem;
        }
        
        .token-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .stat {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem;
            border-radius: 10px;
        }
        
        .stat-label {
            display: block;
            color: #CCCCCC;
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }
        
        .stat-value {
            display: block;
            color: #20B2AA;
            font-size: 1.2rem;
            font-weight: 700;
        }
        
        .token-progress {
            margin: 1rem 0;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #20B2AA, #00CED1);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        .progress-label {
            text-align: center;
            color: #CCCCCC;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        
        .token-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #999999;
            font-size: 0.85rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #CCCCCC;
        }
        
        .empty-state i {
            font-size: 4rem;
            color: rgba(32, 178, 170, 0.3);
            margin-bottom: 1rem;
            display: block;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .empty-state p {
            margin-bottom: 2rem;
        }
</style>
{% endblock %}

{% block content %}
{% include 'app/marketplace_content_inc.html' %}
{% endblock %}

{% block extra_scripts %}
<script>
// Marketplace-specific functionality
(function() {
    // Initialize filter functionality
    function initializeFilters() {
        const filterBtns = document.querySelectorAll('.filter-btn');
        const tokenCards = document.querySelectorAll('.token-card');
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active class from all buttons
                filterBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                
                const filter = this.dataset.filter;
                
                // For now, just show all tokens (you can implement filtering logic here)
                tokenCards.forEach(card => {
                    card.style.display = 'block';
                    // Add animation
                    card.style.animation = 'none';
                    setTimeout(() => {
                        card.style.animation = 'fadeIn 0.5s ease';
                    }, 10);
                });
            });
        });
    }
    
    // Initialize animations
    function initializeAnimations() {
        const tokenCards = document.querySelectorAll('.token-card');
        tokenCards.forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, index * 50);
        });
    }
    
    // Initialize everything
    initializeFilters();
    initializeAnimations();
    
    // Export for re-initialization after HTMX swaps
    window.initializeMarketplaceScripts = function() {
        initializeFilters();
        initializeAnimations();
    };
})();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gemlaunch.fun{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
    <style>
        /* Unified App Layout Styles */
        .app-container {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #0D0D0D 0%, #1A2E2E 50%, #162E3E 100%);
        }
        
        /* Top Bar */
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(32, 178, 170, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 1000;
        }
        
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .sidebar-toggle {
            background: none;
            border: none;
            color: #20B2AA;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.7rem;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-toggle:hover {
            background: rgba(32, 178, 170, 0.15);
            transform: scale(1.05);
        }
        
        .sidebar-toggle:active {
            transform: scale(0.95);
        }
        
        .app-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .app-logo img {
            height: 35px;
        }
        
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .topbar-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(32, 178, 170, 0.1);
            color: #20B2AA;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }
        
        .topbar-icon:hover {
            background: rgba(32, 178, 170, 0.2);
            transform: translateY(-2px);
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(32, 178, 170, 0.1);
            border-radius: 25px;
            border: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .wallet-address {
            color: #CCCCCC;
            font-size: 0.9rem;
            font-family: monospace;
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: #FF6B6B;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.1);
        }
        
        /* Sidebar */
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 280px;
            height: calc(100vh - 60px);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(32, 178, 170, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 999;
            overflow: hidden;
        }
        
        .app-sidebar.collapsed {
            width: 60px;
        }
        
        .sidebar-nav {
            padding: 1rem 0;
            height: 100%;
            overflow-y: auto;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 2rem;
            color: #CCCCCC;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-left: 3px solid transparent;
            position: relative;
            min-height: 50px;
        }
        
        .nav-item:hover {
            background: rgba(32, 178, 170, 0.1);
            color: #20B2AA;
            border-left-color: #20B2AA;
        }
        
        .nav-item.active {
            background: rgba(32, 178, 170, 0.15);
            color: #20B2AA;
            border-left-color: #20B2AA;
        }
        
        .nav-item i {
            width: 24px;
            text-align: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            z-index: 2;
        }
        
        .nav-item span {
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            white-space: nowrap;
            overflow: hidden;
            opacity: 1;
            transform: translateX(0);
        }
        
        .app-sidebar.collapsed .nav-item {
            padding: 1rem 0;
            justify-content: center;
            display: flex;
            align-items: center;
            width: 100%;
            text-align: center;
        }
        
        .app-sidebar.collapsed .nav-item span {
            opacity: 0;
            transform: translateX(20px);
            width: 0;
            margin: 0;
            display: none;
        }
        
        .app-sidebar.collapsed .nav-item i {
            margin: 0 auto;
            width: 24px;
            text-align: center;
            display: block;
        }
        
        /* Main Content */
        .app-main {
            flex: 1;
            margin-top: 60px;
            margin-left: 280px;
            transition: margin-left 0.3s ease;
            min-height: calc(100vh - 60px);
            position: relative;
        }
        
        .app-main.sidebar-collapsed {
            margin-left: 60px;
        }
        
        .main-content {
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        
        /* Background Animation */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        body {
            background: linear-gradient(135deg, #0D0D0D 0%, #1A2E2E 50%, #162E3E 100%);
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .app-topbar {
                padding: 0 1rem;
            }
            
            .app-sidebar {
                width: 100%;
                transform: translateX(-100%);
            }
            
            .app-sidebar.collapsed {
                transform: translateX(-100%);
            }
            
            .app-sidebar:not(.collapsed) {
                transform: translateX(0);
                width: 100%;
            }
            
            .app-main {
                margin-left: 0;
            }
            
            .app-main.sidebar-collapsed {
                margin-left: 0;
            }
            
            .topbar-right {
                gap: 0.5rem;
            }
            
            .user-menu {
                padding: 0.3rem 0.8rem;
            }
            
            .wallet-address {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div id="particles-js"></div>
    <div class="floating-elements"></div>
    
    <div class="app-container">
        <!-- Top Bar -->
        <div class="app-topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="app-logo">
                    <img src="{{ url_for('static', filename='images/gemmy.png') }}" alt="Gemmy">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Gemlaunch.fun">
                </div>
            </div>
            
            <div class="topbar-right">
                <a href="https://gemlaunch.fun/analytics/" class="topbar-icon" target="_blank" title="Analytics">
                    <i class="fas fa-chart-line"></i>
                </a>
                <a href="/docs" class="topbar-icon" title="Documentation">
                    <i class="fas fa-book"></i>
                </a>
                {% if user %}
                <div class="user-menu">
                    <span class="wallet-address">{{ user.wallet_address[:8] }}...{{ user.wallet_address[-6:] }}</span>
                    <button onclick="disconnectWallet()" class="logout-btn">Logout</button>
                </div>
                {% endif %}
            </div>
        </div>
        
        <!-- Sidebar -->
        <nav class="app-sidebar" id="sidebar">
            <div class="sidebar-nav">
                <a href="/app/tokens" class="nav-item {% if request.endpoint == 'token_marketplace' %}active{% endif %}">
                    <i class="fas fa-store"></i>
                    <span>Marketplace</span>
                </a>
                <a href="/app/create" class="nav-item {% if request.endpoint == 'create_token' %}active{% endif %}">
                    <i class="fas fa-rocket"></i>
                    <span>Create Token</span>
                </a>
                {% if user %}
                <a href="/app/dashboard" class="nav-item {% if request.endpoint == 'app_dashboard' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/app/leaderboard" class="nav-item {% if request.endpoint == 'leaderboard' %}active{% endif %}">
                    <i class="fas fa-trophy"></i>
                    <span>Leaderboard</span>
                </a>
                {% endif %}
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="app-main" id="mainContent">
            <div class="main-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    
    <script>
        // Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('sidebar-collapsed');
            
            // Save state
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }
        
        // Restore sidebar state
        document.addEventListener('DOMContentLoaded', function() {
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.getElementById('sidebar').classList.add('collapsed');
                document.getElementById('mainContent').classList.add('sidebar-collapsed');
            }
        });
        
        // Disconnect wallet
        async function disconnectWallet() {
            try {
                const response = await fetch('/api/disconnect-wallet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    window.location.href = '/app';
                }
            } catch (error) {
                console.error('Error disconnecting wallet:', error);
            }
        }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>

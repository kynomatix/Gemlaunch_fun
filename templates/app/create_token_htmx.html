{% extends "app/htmx_layout.html" %}

{% block extra_head %}
<!-- Quill.js Rich Text Editor -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<style>
        .create-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .create-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .create-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .create-header h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .mode-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 0.5rem;
        }
        
        .mode-option {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #CCCCCC;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .mode-option.active {
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            font-weight: 600;
        }
        
        .mode-option h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
        }
        
        .mode-option p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .create-form {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
        }
        
        /* Simple immutability note */
        .immutable-note {
            margin: 1.5rem 0 1rem 0;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #CCCCCC;
            text-align: center;
        }
        
        .immutable-note i {
            color: #20B2AA;
            margin-right: 0.5rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .image-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            border: 2px dashed rgba(32, 178, 170, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .image-upload:hover {
            border-color: #20B2AA;
            background: rgba(32, 178, 170, 0.05);
        }
        
        .image-upload input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .upload-icon {
            font-size: 2rem;
            color: #20B2AA;
            margin-bottom: 0.5rem;
        }
        
        /* Rich Text Editor Styling */
        .description-editor {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            min-height: 120px;
            transition: all 0.3s ease;
        }
        
        .description-editor:focus-within {
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid rgba(32, 178, 170, 0.2) !important;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px 8px 0 0;
        }
        
        .ql-container {
            border: none !important;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif !important;
            font-size: 1rem;
            border-radius: 0 0 8px 8px;
        }
        
        .ql-editor {
            min-height: 80px;
            padding: 1rem;
            color: #FFFFFF !important;
            font-family: 'Inter', sans-serif !important;
        }
        
        .ql-editor.ql-blank::before {
            color: rgba(255, 255, 255, 0.5) !important;
            font-style: normal;
        }
        
        .ql-snow .ql-stroke {
            stroke: #CCCCCC;
        }
        
        .ql-snow .ql-fill {
            fill: #CCCCCC;
        }
        
        .ql-snow .ql-picker {
            color: #CCCCCC;
        }
        
        .ql-snow .ql-picker-options {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(32, 178, 170, 0.3);
        }
        
        /* Form Elements */
        .form-section {
            margin-bottom: 2rem;
        }
        
        .form-section h3 {
            color: #FFFFFF;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #FFFFFF;
            font-weight: 500;
        }
        
        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group input[type="number"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .form-group small {
            display: block;
            margin-top: 0.25rem;
            color: #CCCCCC;
            font-size: 0.85rem;
        }
        
        /* Social Inputs */
        .social-inputs {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .input-group {
            display: flex;
            align-items: center;
        }
        
        .input-prefix {
            padding: 0.75rem 1rem;
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: #20B2AA;
        }
        
        .input-group input {
            flex: 1;
            border-radius: 0 8px 8px 0 !important;
        }
        
        /* Form Actions */
        .form-actions {
            text-align: center;
            margin-top: 2rem;
        }
        
        .btn-lg {
            padding: 1rem 3rem;
            font-size: 1.2rem;
        }
        
        .fee-note {
            margin-top: 1rem;
            color: #CCCCCC;
            font-size: 0.9rem;
        }
        
        .create-btn, .btn-primary {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .create-btn:hover, .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(32, 178, 170, 0.4);
        }
        
        .immutable-note {
            margin: 1.5rem 0;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #CCCCCC;
            text-align: center;
        }
        
        /* Advanced Section */
        .advanced-section {
            border-top: 1px solid rgba(32, 178, 170, 0.2);
            padding-top: 2rem;
        }
        
        /* Advanced Options */
        #advanced-options {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
        }
        
        #advanced-options.active {
            display: block;
        }
        
        .range-input {
            width: 100%;
            margin: 1rem 0;
        }
        
        .supply-info {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        
        .supply-info h4 {
            margin: 0 0 0.5rem 0;
            color: #20B2AA;
        }
        
        .social-links-header {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        
        .social-links-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .mode-selector {
                flex-direction: column;
            }
        }
</style>
{% endblock %}

{% block content %}
{% include 'app/create_token_content_inc.html' %}
{% endblock %}

{% block extra_scripts %}
<script>
// Create Token specific functionality
(function() {
    let quill = null;
    
    // Global functions for onclick handlers
    window.setMode = function(mode) {
        // Update mode selector
        document.querySelectorAll('.mode-option').forEach(option => {
            option.classList.remove('active');
        });
        event.target.closest('.mode-option').classList.add('active');
        
        // Update hidden input
        document.getElementById('mode').value = mode;
        
        // Show/hide advanced options
        const advancedSection = document.getElementById('advanced-options');
        if (mode === 'advanced') {
            advancedSection.classList.add('active');
            advancedSection.style.display = 'block';
        } else {
            advancedSection.classList.remove('active');
            advancedSection.style.display = 'none';
        }
    };
    
    window.updateReserveDisplay = function(value) {
        document.getElementById('reserve-display').textContent = value + '%';
    };
    
    window.toggleSocialLinks = function() {
        const content = document.getElementById('social-links-content');
        const chevron = document.getElementById('social-chevron');
        
        if (content.style.display === 'none') {
            content.style.display = 'block';
            chevron.style.transform = 'rotate(180deg)';
        } else {
            content.style.display = 'none';
            chevron.style.transform = 'rotate(0deg)';
        }
    };
    
    // Initialize Quill editor
    function initializeQuillEditor() {
        const editorDiv = document.getElementById('description-editor');
        if (!editorDiv) return;
        
        // Check if Quill is already loaded
        if (typeof Quill !== 'undefined') {
            if (!editorDiv.classList.contains('ql-container')) {
                quill = new Quill('#description-editor', {
                    theme: 'snow',
                    placeholder: 'Tell the community about your token... 🚀💎🌟',
                    modules: {
                        toolbar: [
                            [{ 'header': [3, 4, false] }],
                            ['bold', 'italic', 'underline'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['link'],
                            ['clean']
                        ]
                    }
                });
                
                // Update hidden input when editor changes
                quill.on('text-change', function() {
                    document.getElementById('description').value = quill.root.innerHTML;
                });
            }
        } else {
            // Dynamically load Quill.js if not present
            const link = document.createElement('link');
            link.href = 'https://cdn.quilljs.com/1.3.7/quill.snow.css';
            link.rel = 'stylesheet';
            document.head.appendChild(link);
            
            const script = document.createElement('script');
            script.src = 'https://cdn.quilljs.com/1.3.7/quill.min.js';
            script.onload = function() {
                initializeQuillEditor();
            };
            document.head.appendChild(script);
        }
    }
    
    // Mode selector functionality - removed since we use onclick handlers now
    
    // Image upload preview
    function initializeImageUpload() {
        const imageInput = document.getElementById('image');
        const uploadDiv = document.querySelector('.image-upload');
        
        if (imageInput) {
            imageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        // Update upload div with preview
                        uploadDiv.innerHTML = `
                            <img src="${e.target.result}" style="max-width: 100%; max-height: 120px; border-radius: 10px;">
                            <small style="margin-top: 0.5rem;">Click to change</small>
                            <input type="file" id="image" name="image" accept="image/*" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
                        `;
                        // Re-attach event listener to new input
                        initializeImageUpload();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    }
    
    // Form validation
    function initializeFormValidation() {
        const form = document.querySelector('.create-form');
        if (form) {
            form.addEventListener('submit', function(e) {
                const name = document.getElementById('name').value.trim();
                const symbol = document.getElementById('symbol').value.trim();
                const description = document.getElementById('description').value.trim();
                
                if (!name || !symbol || !description) {
                    e.preventDefault();
                    alert('Please fill in all required fields');
                    return false;
                }
                
                // Symbol validation
                if (!/^[A-Za-z]+$/.test(symbol)) {
                    e.preventDefault();
                    alert('Token symbol must contain only letters');
                    return false;
                }
            });
        }
    }
    
    // Initialize everything
    initializeQuillEditor();
    initializeImageUpload();
    initializeFormValidation();
    
    // Export for re-initialization after HTMX swaps
    window.initializeCreateTokenScripts = function() {
        initializeQuillEditor();
        initializeImageUpload();
        initializeFormValidation();
    };
})();

// Re-initialize on HTMX swap
if (window.htmx) {
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'content-area' && window.initializeCreateTokenScripts) {
            window.initializeCreateTokenScripts();
        }
    });
}
</script>
{% endblock %}

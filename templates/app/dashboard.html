{% extends "app/base_layout.html" %}

{% block title %}Dashboard - Gemlaunch.fun{% endblock %}

{% block extra_head %}
<style>
        /* Dashboard-specific styles */
        .dashboard-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 168, 168, 0.05));
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(32, 178, 170, 0.5);
            box-shadow: 0 10px 25px rgba(32, 178, 170, 0.15);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }
        
        .stat-label {
            color: #CCCCCC;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        .dashboard-section {
            margin-bottom: 3rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            font-size: 1.8rem;
            color: #20B2AA;
            margin: 0;
        }
        
        .token-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .token-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .token-card:hover {
            transform: translateY(-5px);
            border-color: rgba(32, 178, 170, 0.5);
            box-shadow: 0 10px 30px rgba(32, 178, 170, 0.2);
        }
        
        .token-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .token-image {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .token-info h3 {
            color: #FFFFFF;
            margin: 0;
            font-size: 1.2rem;
        }
        
        .token-symbol {
            color: #20B2AA;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .token-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .token-stat {
            text-align: center;
        }
        
        .token-stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #20B2AA;
        }
        
        .token-stat-label {
            font-size: 0.8rem;
            color: #CCCCCC;
            margin-top: 0.2rem;
        }
        
        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin: 1rem 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #CCCCCC;
        }
        
        .empty-state i {
            font-size: 3rem;
            color: #20B2AA;
            margin-bottom: 1rem;
        }
        
        .quick-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .action-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: #CCCCCC;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .action-card:hover {
            transform: translateY(-3px);
            border-color: #20B2AA;
            background: rgba(32, 178, 170, 0.1);
            color: #20B2AA;
        }
        
        .action-card i {
            font-size: 2rem;
            color: #20B2AA;
        }
        
        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 0.5rem;
        }
        
        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #CCCCCC;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .tab-btn:hover {
            background: rgba(32, 178, 170, 0.1);
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.3), rgba(0, 206, 209, 0.2));
            color: #20B2AA;
            font-weight: 600;
        }
        
        .tab-pane {
            display: none;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        /* Portfolio specific styles */
        .holding-info {
            background: rgba(32, 178, 170, 0.1);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .holding-stat {
            text-align: center;
        }
        
        .holding-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #20B2AA;
            display: block;
        }
        
        .holding-label {
            font-size: 0.8rem;
            color: #CCCCCC;
            margin-top: 0.3rem;
        }
        
        /* Activities styles */
        .activities-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .activity-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        .activity-item:hover {
            transform: translateX(5px);
            border-color: rgba(32, 178, 170, 0.5);
        }
        
        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(32, 178, 170, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-description {
            color: #FFFFFF;
            margin-bottom: 0.3rem;
        }
        
        .activity-time {
            color: #888888;
            font-size: 0.85rem;
        }
        
        .activity-points {
            color: #20B2AA;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        /* Achievements styles */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        
        .achievement-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .achievement-card.unlocked {
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.1), rgba(0, 206, 209, 0.05));
            border-color: #20B2AA;
        }
        
        .achievement-card.locked {
            opacity: 0.5;
        }
        
        .achievement-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(32, 178, 170, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #20B2AA;
        }
        
        .achievement-info h4 {
            color: #FFFFFF;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        .achievement-info p {
            color: #CCCCCC;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        
        .achievement-points {
            color: #20B2AA;
            font-weight: bold;
        }
        
        .achievement-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: #20B2AA;
            font-size: 1.2rem;
        }
        
        .achievement-count {
            color: #20B2AA;
            font-size: 0.9rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .quick-actions {
                flex-direction: column;
            }
            
            .tab-navigation {
                flex-direction: column;
            }
            
            .token-grid {
                grid-template-columns: 1fr;
            }
            
            .achievements-grid {
                grid-template-columns: 1fr;
            }
        }
</style>
{% endblock %}

{% block content %}
    {% include 'app/partials/dashboard_content.html' %}
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}

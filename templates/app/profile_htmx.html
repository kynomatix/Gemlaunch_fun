{% extends "app/htmx_layout.html" %}

{% block extra_head %}
<style>
        /* Profile Container */
        .profile-container {
            padding-top: 100px;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .profile-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .profile-subtitle {
            color: #CCCCCC;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .tab-btn {
            background: none;
            border: none;
            color: #CCCCCC;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tab-btn:hover {
            color: #20B2AA;
        }
        
        .tab-btn.active {
            color: #20B2AA;
            border-bottom-color: #20B2AA;
        }
        
        .tab-pane {
            display: none;
        }
        
        .tab-pane.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Profile Grid */
        .profile-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        
        /* Profile Section */
        .profile-section,
        .wallet-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(32, 178, 170, 0.1);
        }
        
        .section-header h2 {
            color: #FFFFFF;
            font-size: 1.3rem;
        }
        
        .btn-edit-profile,
        .btn-add-wallet {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            color: #20B2AA;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-edit-profile:hover,
        .btn-add-wallet:hover {
            background: rgba(32, 178, 170, 0.2);
            transform: translateY(-2px);
        }
        
        /* Profile Fields */
        .profile-fields {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .field-group {
            display: flex;
            flex-direction: column;
        }
        
        .field-group label {
            color: #999999;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .field-value {
            color: #FFFFFF;
            font-size: 1rem;
        }
        
        /* Edit Form */
        .profile-edit-form {
            animation: fadeIn 0.5s ease;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            display: block;
            color: #FFFFFF;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .form-group small {
            display: block;
            color: #999999;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        
        /* Privacy Settings */
        .privacy-settings {
            margin-top: 1rem;
        }
        
        .privacy-settings h3 {
            color: #FFFFFF;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #CCCCCC;
            cursor: pointer;
        }
        
        .checkbox-label input[type="checkbox"] {
            width: auto;
        }
        
        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        /* Wallets Section */
        .wallets-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .wallet-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .wallet-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .wallet-item.primary {
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.1), rgba(0, 206, 209, 0.05));
            border-color: rgba(32, 178, 170, 0.3);
        }
        
        .wallet-icon {
            font-size: 1.5rem;
            color: #20B2AA;
        }
        
        .wallet-details {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .wallet-label {
            color: #FFFFFF;
            font-weight: 600;
        }
        
        .wallet-address {
            color: #999999;
            font-size: 0.9rem;
            font-family: monospace;
        }
        
        .wallet-badge {
            background: rgba(32, 178, 170, 0.2);
            color: #20B2AA;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .wallet-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            background: none;
            border: none;
            color: #999999;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-icon:hover {
            color: #20B2AA;
        }
        
        .btn-icon.delete:hover {
            color: #FF6B6B;
        }
        
        .wallet-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #CCCCCC;
        }
        
        /* Referrals Tab */
        .referrals-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .referral-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .stat-card i {
            font-size: 2rem;
            color: #20B2AA;
        }
        
        .stat-content {
            display: flex;
            flex-direction: column;
        }
        
        .stat-content .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #20B2AA;
        }
        
        .stat-content .stat-label {
            color: #999999;
            font-size: 0.9rem;
        }
        
        /* Referral Link Section */
        .referral-link-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .referral-link-section h3 {
            color: #FFFFFF;
            margin-bottom: 1rem;
        }
        
        .referral-link-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .referral-link-box input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-family: monospace;
        }
        
        .referral-help {
            color: #CCCCCC;
            font-size: 0.9rem;
        }
        
        /* Referred Users */
        .referred-users-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 2rem;
        }
        
        .referred-users-section h3 {
            color: #FFFFFF;
            margin-bottom: 1.5rem;
        }
        
        .referred-users-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .referred-user {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: rgba(32, 178, 170, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #20B2AA;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-info .username {
            display: block;
            color: #FFFFFF;
            font-weight: 600;
        }
        
        .user-info .join-date {
            display: block;
            color: #999999;
            font-size: 0.85rem;
        }
        
        .user-stats .stat {
            color: #20B2AA;
            font-weight: 600;
        }
        
        /* Empty Referrals */
        .empty-referrals {
            text-align: center;
            padding: 3rem;
            color: #CCCCCC;
        }
        
        .empty-referrals i {
            font-size: 3rem;
            color: rgba(32, 178, 170, 0.3);
            margin-bottom: 1rem;
            display: block;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: rgba(30, 30, 40, 0.98);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-header h3 {
            color: #FFFFFF;
            font-size: 1.5rem;
        }
        
        .btn-close {
            background: none;
            border: none;
            color: #999999;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .btn-close:hover {
            color: #FFFFFF;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .referral-link-box {
                flex-direction: column;
            }
        }
</style>
{% endblock %}

{% block content %}
{% include 'app/profile_content_inc.html' %}
{% endblock %}

{% block extra_scripts %}
<script>
// Profile-specific functionality
(function() {
    // Tab switching
    window.switchTab = function(tabName) {
        // Remove active from all tabs and panes
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        
        // Add active to selected tab and pane
        const btn = document.querySelector(`[onclick="switchTab('${tabName}')"]`);
        if (btn) btn.classList.add('active');
        
        const tab = document.getElementById(`${tabName}-tab`);
        if (tab) tab.classList.add('active');
    };
    
    // Toggle edit mode
    window.toggleEditMode = function() {
        const viewMode = document.getElementById('profileView');
        const editMode = document.getElementById('profileEdit');
        
        if (viewMode && editMode) {
            if (viewMode.style.display === 'none') {
                viewMode.style.display = 'block';
                editMode.style.display = 'none';
            } else {
                viewMode.style.display = 'none';
                editMode.style.display = 'block';
            }
        }
    };
    
    // Wallet modal functions
    window.openAddWalletModal = function() {
        const modal = document.getElementById('addWalletModal');
        if (modal) {
            modal.style.display = 'flex';
        }
    };
    
    window.closeAddWalletModal = function() {
        const modal = document.getElementById('addWalletModal');
        if (modal) {
            modal.style.display = 'none';
        }
        // Clear form
        const form = document.getElementById('addWalletForm');
        if (form) form.reset();
    };
    
    // Copy referral link
    window.copyReferralLink = function() {
        const input = document.getElementById('referralLink');
        if (input) {
            input.select();
            input.setSelectionRange(0, 99999); // For mobile devices
            
            navigator.clipboard.writeText(input.value).then(function() {
                // Show success message
                const btn = event.target.closest('button');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.background = 'rgba(0, 255, 100, 0.2)';
                
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.background = '';
                }, 2000);
            }).catch(function() {
                alert('Failed to copy. Please copy manually.');
            });
        }
    };
    
    // Add wallet form submission
    const addWalletForm = document.getElementById('addWalletForm');
    if (addWalletForm) {
        addWalletForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const label = document.getElementById('walletLabel').value;
            const address = document.getElementById('walletAddress').value;
            
            fetch('/app/add-wallet', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ label, address })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload(); // Refresh to show new wallet
                } else {
                    alert(data.error || 'Failed to add wallet');
                }
            })
            .catch(error => {
                alert('Error adding wallet');
            });
        });
    }
    
    // Edit wallet function
    window.editWallet = function(walletId) {
        const newLabel = prompt('Enter new wallet label:');
        if (newLabel) {
            fetch(`/app/edit-wallet/${walletId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ label: newLabel })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                } else {
                    alert(data.error || 'Failed to edit wallet');
                }
            });
        }
    };
    
    // Remove wallet function
    window.removeWallet = function(walletId) {
        if (confirm('Are you sure you want to remove this wallet?')) {
            fetch(`/app/remove-wallet/${walletId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                } else {
                    alert(data.error || 'Failed to remove wallet');
                }
            });
        }
    };
    
    // Initialize animations
    function initializeAnimations() {
        const statCards = document.querySelectorAll('.stat-card');
        statCards.forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, index * 100);
        });
    }
    
    // Initialize everything
    initializeAnimations();
    
    // Export for re-initialization after HTMX swaps
    window.initializeProfileScripts = function() {
        initializeAnimations();
    };
})();
</script>
{% endblock %}

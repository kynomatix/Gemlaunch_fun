{% extends "app/htmx_layout.html" %}

{% block extra_head %}
<style>
        /* Dashboard-specific styles */
        .dashboard-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 168, 168, 0.05));
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(32, 178, 170, 0.4);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }
        
        .stat-label {
            color: #CCCCCC;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Section Styles */
        .dashboard-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFFFF;
        }
        
        /* Token Grid */
        .token-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .token-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .token-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: #20B2AA;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #CCCCCC;
        }
        
        .empty-state i {
            font-size: 4rem;
            color: rgba(32, 178, 170, 0.3);
            margin-bottom: 1rem;
            display: block;
        }
        
        /* Tab Navigation */
        .dashboard-tabs {
            margin-top: 2rem;
        }
        
        .tab-navigation {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 0.5rem;
            border: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #888888;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .tab-btn:hover {
            background: rgba(32, 178, 170, 0.1);
            color: #20B2AA;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            box-shadow: 0 5px 15px rgba(32, 178, 170, 0.3);
        }
        
        .tab-pane {
            display: none;
        }
        
        .tab-pane.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Section Title */
        .section-title {
            font-size: 1.8rem;
            color: #FFFFFF;
            margin: 0 0 1.5rem 0;
        }
        
        /* Token Card Styles */
        .token-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .token-image {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .token-info h3 {
            color: #FFFFFF;
            margin: 0;
            font-size: 1.2rem;
        }
        
        .token-symbol {
            color: #20B2AA;
            font-size: 0.9rem;
        }
        
        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #20B2AA, #00CED1);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        /* Token Stats */
        .token-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .token-stat {
            text-align: center;
        }
        
        .token-stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #20B2AA;
        }
        
        .token-stat-label {
            font-size: 0.8rem;
            color: #CCCCCC;
            margin-top: 0.25rem;
        }
        
        /* View Button */
        .token-view-btn {
            width: 100%;
            padding: 0.75rem;
            background: transparent;
            border: 1px solid #20B2AA;
            border-radius: 10px;
            color: #20B2AA;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        
        .token-view-btn:hover {
            background: rgba(32, 178, 170, 0.1);
            transform: translateY(-2px);
        }
        
        /* Accolades Styles */
        .activities-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        
        .accolades-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(32, 178, 170, 0.15);
            border-radius: 15px;
            padding: 1.5rem;
        }
        
        .accolades-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .accolade-card {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .accolade-card.unlocked {
            background: linear-gradient(135deg, rgba(0, 255, 100, 0.1), rgba(32, 178, 170, 0.05));
            border-color: rgba(0, 255, 100, 0.3);
        }
        
        .accolade-card.locked {
            opacity: 0.6;
        }
        
        .accolade-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(32, 178, 170, 0.1);
            border-radius: 10px;
            font-size: 1.2rem;
        }
        
        .accolade-info h4 {
            margin: 0 0 0.25rem 0;
            font-size: 0.95rem;
            color: #FFFFFF;
        }
        
        .accolade-info p {
            margin: 0 0 0.5rem 0;
            font-size: 0.75rem;
            color: #CCCCCC;
            line-height: 1.3;
        }
        
        .points-value {
            color: #20B2AA;
            font-size: 0.8rem;
        }
        
        .unlocked-label {
            color: #00FF64;
            font-size: 0.8rem;
        }
        
        .recent-activities-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(32, 178, 170, 0.15);
            border-radius: 15px;
            padding: 1.5rem;
        }
        
        .activities-timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .activity-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        
        .activity-icon {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(32, 178, 170, 0.1);
            border-radius: 8px;
            color: #20B2AA;
        }
        
        .activity-content h4 {
            margin: 0;
            font-size: 0.9rem;
            color: #FFFFFF;
        }
        
        .points-earned {
            color: #00FF64;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
        
        .empty-activities {
            text-align: center;
            padding: 2rem;
            color: #CCCCCC;
        }
        
        .progress-summary {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.2), rgba(0, 255, 255, 0.1));
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .progress-summary .completed {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00FF64;
        }
        
        .progress-summary .total {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFFFFF;
        }
        
        .accolades-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .accolade-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .accolade-item.completed {
            background: linear-gradient(135deg, rgba(0, 255, 100, 0.1), rgba(32, 178, 170, 0.05));
            border-color: rgba(0, 255, 100, 0.3);
        }
        
        .accolade-item.locked {
            opacity: 0.6;
        }
        
        .accolade-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(32, 178, 170, 0.1);
            border-radius: 10px;
            font-size: 1.2rem;
            color: #20B2AA;
        }
        
        .accolade-item.completed .accolade-icon {
            background: rgba(0, 255, 100, 0.2);
            color: #00FF64;
        }
        
        @media (max-width: 768px) {
            .quick-actions {
                flex-direction: column;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .user-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .token-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
{% endblock %}

{% block content %}
{% include "app/dashboard_content_inc.html" %}
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
// Dashboard-specific initialization
(function() {
    // Initialize dashboard when this template loads
    if (window.initializeDashboard) {
        window.initializeDashboard();
    }
})();
</script>
{% endblock %}

{% extends "app/htmx_layout.html" %}

{% block extra_head %}
<style>
        /* Dashboard-specific styles */
        .dashboard-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 168, 168, 0.05));
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(32, 178, 170, 0.4);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #20B2AA;
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #CCCCCC;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Section Styles */
        .dashboard-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFFFF;
        }
        
        /* Token Grid */
        .token-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .token-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .token-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: #20B2AA;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #CCCCCC;
        }
        
        .empty-state i {
            font-size: 4rem;
            color: rgba(32, 178, 170, 0.3);
            margin-bottom: 1rem;
            display: block;
        }
        
        /* Tab Navigation */
        .dashboard-tabs {
            margin-top: 2rem;
        }
        
        .tab-navigation {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .tab-btn {
            background: none;
            border: none;
            color: #CCCCCC;
            padding: 1rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tab-btn:hover {
            color: #20B2AA;
        }
        
        .tab-btn.active {
            color: #20B2AA;
            border-bottom-color: #20B2AA;
        }
        
        .tab-pane {
            display: none;
        }
        
        .tab-pane.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Accolades Styles */
        .activities-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        
        .accolades-progress-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(32, 178, 170, 0.15);
            border-radius: 15px;
            padding: 1.5rem;
        }
        
        .progress-summary {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, rgba(32, 178, 170, 0.2), rgba(0, 255, 255, 0.1));
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .progress-summary .completed {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00FF64;
        }
        
        .progress-summary .total {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFFFFF;
        }
        
        .accolades-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .accolade-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .accolade-item.completed {
            background: linear-gradient(135deg, rgba(0, 255, 100, 0.1), rgba(32, 178, 170, 0.05));
            border-color: rgba(0, 255, 100, 0.3);
        }
        
        .accolade-item.locked {
            opacity: 0.6;
        }
        
        .accolade-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(32, 178, 170, 0.1);
            border-radius: 10px;
            font-size: 1.2rem;
            color: #20B2AA;
        }
        
        .accolade-item.completed .accolade-icon {
            background: rgba(0, 255, 100, 0.2);
            color: #00FF64;
        }
        
        @media (max-width: 768px) {
            .quick-actions {
                flex-direction: column;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .user-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .token-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
{% endblock %}

{% block content %}
{% include "app/dashboard_content_inc.html" %}
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
    // Wallet disconnect functionality
    async function disconnectWallet() {
        try {
            const response = await fetch('/api/disconnect-wallet', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Redirect to connect wallet page
                window.location.href = '/app';
            } else {
                console.error('Failed to disconnect wallet');
            }
            
        } catch (error) {
            console.error('Disconnect error:', error);
        }
    }

    // Tab switching functionality
    function switchTab(tabName) {
        // Remove active class from all tabs and buttons
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        
        // Add active class to selected tab and button
        const targetBtn = document.querySelector(`button[data-tab="${tabName}"]`);
        if (targetBtn) targetBtn.classList.add('active');
        const targetTab = document.getElementById(`${tabName}-tab`);
        if (targetTab) targetTab.classList.add('active');
    }

    // Activities filtering functionality
    function filterActivities(type) {
        const activityItems = document.querySelectorAll('.activity-item');
        
        activityItems.forEach(item => {
            const itemType = item.getAttribute('data-type');
            
            if (type === 'all' || itemType === type) {
                item.style.display = 'grid';
            } else {
                item.style.display = 'none';
            }
        });
    }

    // Toggle tips functionality
    function toggleTips() {
        const tipsList = document.getElementById('tipsList');
        const tipsToggle = document.getElementById('tipsToggle');
        
        if (tipsList && tipsToggle) {
            tipsList.classList.toggle('expanded');
            tipsToggle.classList.toggle('expanded');
        }
    }
    
    // Initialize on load
    function initializePageScripts() {
        // Attach tab switching events
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });
        
        // Attach tips toggle event
        const tipsHeader = document.getElementById('tipsHeader');
        if (tipsHeader) {
            tipsHeader.addEventListener('click', toggleTips);
        }
        
        const achievementItems = document.querySelectorAll('.accolade-item');
        achievementItems.forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                item.style.transition = 'all 0.5s ease';
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, index * 100);
        });
        
        const activityItems = document.querySelectorAll('.activity-item');
        activityItems.forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                item.style.transition = 'all 0.5s ease';
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, 300 + (index * 80));
        });
        
        const pointsSources = document.querySelectorAll('.points-source');
        pointsSources.forEach((source, index) => {
            source.style.opacity = '0';
            source.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                source.style.transition = 'all 0.5s ease';
                source.style.opacity = '1';
                source.style.transform = 'translateY(0)';
            }, 600 + (index * 100));
        });
    }
    
    // Call initialization
    initializePageScripts();
</script>
{% endblock %}

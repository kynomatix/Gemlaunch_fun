{% extends "app/base_layout.html" %}

{% block title %}Create Token - Gemlaunch.fun{% endblock %}

{% block extra_head %}
<!-- Quill.js Rich Text Editor -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<style>
        .create-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .create-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .create-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .create-header h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .header-section {
            margin-top: 2rem;
            text-align: left;
        }
        
        .header-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFFFF;
            margin: 0 0 0.5rem 0;
        }
        
        .header-section p {
            color: #CCCCCC;
            font-size: 0.95rem;
            margin: 0;
        }
        
        .create-form {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: #FFFFFF;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }
        
        .form-group input[type="text"], 
        .form-group input[type="url"] {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Social Links Section */
        .social-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .social-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .social-header label {
            margin: 0;
            cursor: pointer;
        }
        
        .social-chevron {
            transition: transform 0.3s ease;
            color: #CCCCCC;
        }
        
        .social-chevron.expanded {
            transform: rotate(180deg);
        }
        
        .social-links {
            padding: 0 1rem 1rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .social-input-group {
            margin-bottom: 1rem;
        }
        
        .social-input-group:last-child {
            margin-bottom: 0;
        }
        
        .social-input-group label {
            font-size: 0.9rem;
            color: #CCCCCC;
            margin-bottom: 0.25rem;
        }
        
        /* File Upload Section */
        .file-upload-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .upload-container {
            position: relative;
        }
        
        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            margin: 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #20B2AA;
            background: rgba(32, 178, 170, 0.05);
        }
        
        .upload-area.dragover {
            border-color: #20B2AA;
            background: rgba(32, 178, 170, 0.1);
        }
        
        .upload-content {
            text-align: center;
        }
        
        .upload-text p {
            margin: 0.25rem 0;
            color: #CCCCCC;
        }
        
        .upload-text p:first-child {
            color: #FFFFFF;
            font-size: 1.1rem;
        }
        
        .or-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: #20B2AA;
            margin-bottom: 1rem;
        }
        
        /* File Info */
        .file-info {
            background: rgba(255, 255, 255, 0.02);
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .file-info-section {
            margin-bottom: 1rem;
        }
        
        .file-info-section:last-child {
            margin-bottom: 0;
        }
        
        .file-info h4 {
            color: #FFFFFF;
            font-size: 0.9rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }
        
        .file-info p {
            color: #CCCCCC;
            font-size: 0.85rem;
            margin: 0.25rem 0;
        }
        
        /* Banner Upload */
        .banner-upload {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .banner-upload:hover {
            border-color: #20B2AA;
            background: rgba(32, 178, 170, 0.05);
        }
        
        .banner-upload input {
            display: none;
        }
        
        .banner-upload .upload-icon {
            font-size: 2rem;
            margin: 0;
        }
        
        .banner-upload .upload-text p {
            margin: 0.25rem 0;
            color: #CCCCCC;
        }
        
        .banner-upload .upload-text p:first-child {
            color: #FFFFFF;
            font-weight: 500;
        }
        
        /* Warning Section */
        .warning-section {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        
        .warning-section i {
            color: #FFC107;
            font-size: 1.2rem;
            margin-top: 0.2rem;
        }
        
        .warning-section p {
            color: #FFC107;
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        /* Rich Text Editor Styling */
        .description-editor {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            min-height: 120px;
            transition: all 0.3s ease;
        }
        
        .description-editor:focus-within {
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid rgba(32, 178, 170, 0.2) !important;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px 8px 0 0;
        }
        
        .ql-container {
            border: none !important;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif !important;
            font-size: 1rem;
            border-radius: 0 0 8px 8px;
        }
        
        .ql-editor {
            min-height: 80px;
            padding: 1rem;
            color: #FFFFFF !important;
            font-family: 'Inter', sans-serif !important;
        }
        
        .ql-editor.ql-blank::before {
            color: rgba(255, 255, 255, 0.5) !important;
            font-style: normal;
        }
        
        .ql-snow .ql-stroke {
            stroke: #CCCCCC;
        }
        
        .ql-snow .ql-fill {
            fill: #CCCCCC;
        }
        
        .ql-snow .ql-picker {
            color: #CCCCCC;
        }
        
        .ql-snow .ql-picker-options {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(32, 178, 170, 0.3);
        }
        
        .ql-snow .ql-picker-item:hover {
            background: rgba(32, 178, 170, 0.2);
        }
        
        .supply-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .supply-info h4 {
            color: #20B2AA;
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
        }
        
        .supply-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #CCCCCC;
            line-height: 1.5;
        }
        
        .range-input {
            width: 100%;
            margin: 1rem 0;
        }
        
        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #CCCCCC;
            margin-bottom: 0.5rem;
        }
        
        .advanced-section {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .advanced-section.active {
            display: block;
        }
        
        .create-btn {
            width: 100%;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }
        
        .create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(32, 178, 170, 0.4);
        }
        
        .create-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* File size info styling */
        .file-size-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #20B2AA;
        }
        
        /* Add textarea styling to match other inputs */
        .form-group textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group textarea:focus {
            outline: none;
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Inter', sans-serif;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .mode-selector {
                flex-direction: column;
            }
            
            .create-header h1 {
                font-size: 2rem;
            }
            
            .image-upload {
                min-height: 100px;
            }
            
            .ql-editor {
                min-height: 60px;
            }
        }
{% endblock %}

{% block content %}
            <div class="create-container">
                <div class="create-header">
                    <h1>Create new coin</h1>
                    <div class="header-section">
                        <h2>Coin details</h2>
                        <p>Choose carefully, these can't be changed once the coin is created</p>
                    </div>
                </div>

                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% for category, message in messages %}
                                <div class="flash-message flash-{{ category }}">
                                    <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-triangle' if category == 'error' else 'info-circle' }}"></i>
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}


                <!-- Create Form -->
                <form method="POST" enctype="multipart/form-data" class="create-form">
                    <!-- Coin Name -->
                    <div class="form-group">
                        <label for="name">Coin name</label>
                        <input type="text" id="name" name="name" required placeholder="Name your coin" value="My Awesome Coin">
                    </div>

                    <!-- Ticker -->
                    <div class="form-group">
                        <label for="symbol">Ticker</label>
                        <input type="text" id="symbol" name="symbol" required placeholder="Add a coin ticker (e.g. DOGE)" maxlength="10" style="text-transform: uppercase;">
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <div class="description-editor" id="description-editor"></div>
                        <input type="hidden" id="description" name="description">
                    </div>

                    <!-- Social Links -->
                    <div class="form-group">
                        <div class="social-section">
                            <div class="social-header" onclick="toggleSocialLinks()">
                                <label>Add social links (Optional)</label>
                                <i class="fas fa-chevron-down social-chevron" id="social-chevron"></i>
                            </div>
                            <div class="social-links" id="social-links" style="display: none;">
                                <div class="social-input-group">
                                    <label for="website">Website</label>
                                    <input type="url" id="website" name="website" placeholder="https://example.com">
                                </div>
                                <div class="social-input-group">
                                    <label for="twitter">X</label>
                                    <input type="url" id="twitter" name="twitter" placeholder="https://x.com/username">
                                </div>
                                <div class="social-input-group">
                                    <label for="telegram">Telegram</label>
                                    <input type="url" id="telegram" name="telegram" placeholder="https://t.me/channel">
                                </div>
                                <div class="social-input-group">
                                    <label for="discord">Discord</label>
                                    <input type="url" id="discord" name="discord" placeholder="https://discord.gg/server">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- File Upload -->
                    <div class="form-group">
                        <div class="file-upload-section">
                            <div class="upload-container" id="upload-container">
                                <div class="upload-area" id="upload-area">
                                    <input type="file" id="image" name="image" accept="image/*,video/*" style="display: none;">
                                    <div class="upload-content">
                                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                                        <div class="upload-text">
                                            <p><strong>No file chosen</strong></p>
                                            <p>Select video or image to upload</p>
                                            <p class="or-text">or drag and drop it here</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="file-info">
                                <div class="file-info-section">
                                    <h4>File size and type</h4>
                                    <p><strong>Image</strong> - max 15mb. '.jpg', '.gif' or '.png' recommended</p>
                                    <p><strong>Video</strong> - max 30mb. '.mp4' recommended</p>
                                </div>
                                <div class="file-info-section">
                                    <h4>Resolution and aspect ratio</h4>
                                    <p><strong>Image</strong> - min. 1000x1000px, 1:1 square recommended</p>
                                    <p><strong>Video</strong> - 16:9 or 9:16, 1080p+ recommended</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Banner Upload -->
                    <div class="form-group">
                        <label for="banner">Add banner (Optional)</label>
                        <div class="banner-upload" onclick="document.getElementById('banner').click()">
                            <input type="file" id="banner" name="banner" accept="image/*">
                            <i class="fas fa-image upload-icon"></i>
                            <div class="upload-text">
                                <p>Upload banner image</p>
                                <p>Recommended: 1500x500px</p>
                            </div>
                        </div>
                    </div>

                    <!-- Warning -->
                    <div class="warning-section">
                        <i class="fas fa-info-circle"></i>
                        <p>Coin data (social links, banner, etc) can only be added now, and can't be changed or edited after creation</p>
                    </div>


                    <button type="submit" class="create-btn">
                        <i class="fas fa-rocket"></i>
                        Create Coin
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
        // Initialize Rich Text Editor
        let quill = new Quill('#description-editor', {
            theme: 'snow',
            placeholder: 'Write a short description',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link'],
                    ['clean']
                ]
            }
        });
        
        // Update hidden input when content changes
        quill.on('text-change', function() {
            document.getElementById('description').value = quill.root.innerHTML;
        });
        
        // Social links toggle
        function toggleSocialLinks() {
            const socialLinks = document.getElementById('social-links');
            const chevron = document.getElementById('social-chevron');
            
            if (socialLinks.style.display === 'none') {
                socialLinks.style.display = 'block';
                chevron.classList.add('expanded');
            } else {
                socialLinks.style.display = 'none';
                chevron.classList.remove('expanded');
            }
        }
        
        // Global variable to track compressed file
        let currentCompressedFile = null;
        
        // Initialize file upload handlers
        function initFileUploadHandlers() {
            const imageInput = document.getElementById('image');
            const uploadArea = document.getElementById('upload-area');
            
            if (imageInput) {
                imageInput.addEventListener('change', handleFileUpload);
            }
            
            if (uploadArea) {
                // Click to upload
                uploadArea.addEventListener('click', function() {
                    imageInput.click();
                });
                
                // Drag and drop functionality
                uploadArea.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });
                
                uploadArea.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                });
                
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        processUploadedFile(files[0]);
                    }
                });
            }
        }
        
        // Enhanced file upload handler with drag & drop and video support
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                processUploadedFile(file);
            }
        }
        
        function processUploadedFile(file) {
            // Validate file type
            const isImage = file.type.startsWith('image/');
            const isVideo = file.type.startsWith('video/');
            
            if (!isImage && !isVideo) {
                alert('⚠️ Please select a valid image (.jpg, .png, .gif) or video (.mp4) file');
                return;
            }
            
            // Validate file size based on type
            const maxSize = isImage ? 15 * 1024 * 1024 : 30 * 1024 * 1024; // 15MB for images, 30MB for videos
            const fileTypeText = isImage ? 'image' : 'video';
            
            if (file.size > maxSize) {
                alert(`⚠️ ${fileTypeText.charAt(0).toUpperCase() + fileTypeText.slice(1)} too large! Please select a ${fileTypeText} under ${maxSize / (1024 * 1024)}MB.`);
                return;
            }
            
            // Show processing status
            const uploadArea = document.getElementById('upload-area');
            uploadArea.innerHTML = `
                <input type="file" id="image" name="image" accept="image/*,video/*" style="display: none;">
                <i class="fas fa-spinner fa-spin upload-icon"></i>
                <div class="upload-text">
                    <p><strong>Processing ${fileTypeText}...</strong></p>
                    <p>Validating and optimizing for blockchain</p>
                </div>
            `;
            
            // Re-attach listeners
            initFileUploadHandlers();
            
            if (isImage) {
                // Validate image dimensions
                const img = new Image();
                img.onload = function() {
                    if (img.width < 1000 || img.height < 1000) {
                        uploadArea.innerHTML = `
                            <input type="file" id="image" name="image" accept="image/*,video/*" style="display: none;">
                            <i class="fas fa-exclamation-triangle upload-icon" style="color: #FF6B6B;"></i>
                            <div class="upload-text">
                                <p><strong style="color: #FF6B6B;">Image too small</strong></p>
                                <p>Minimum resolution: 1000x1000px</p>
                                <p class="or-text">Current: ${img.width}x${img.height}px</p>
                            </div>
                        `;
                        initFileUploadHandlers();
                        return;
                    }
                    
                    // Compress image for blockchain
                    compressImage(file, function(compressedFile, originalSize, compressedSize, success) {
                        displayUploadSuccess(compressedFile || file, originalSize, compressedSize || file.size, isImage, success);
                    });
                };
                img.src = URL.createObjectURL(file);
            } else {
                // For videos, show success without compression
                displayUploadSuccess(file, file.size, file.size, false, true);
            }
        }
        
        function displayUploadSuccess(file, originalSize, finalSize, isImage, compressionSuccess) {
            const uploadArea = document.getElementById('upload-area');
            const isVideo = file.type.startsWith('video/');
            const mediaElement = isVideo ? 
                `<video src="${URL.createObjectURL(file)}" style="max-width: 120px; max-height: 80px; border-radius: 8px; object-fit: cover;" muted></video>` :
                `<img src="${URL.createObjectURL(file)}" style="max-width: 120px; max-height: 80px; border-radius: 8px; object-fit: cover;">`;
            
            const compressionText = isImage && compressionSuccess ? 
                `<p style="margin-top: 0.5rem; font-size: 0.9rem; color: #20B2AA;">
                    ✅ Optimized: ${formatFileSize(originalSize)} → ${formatFileSize(finalSize)}
                </p>` : 
                `<p style="margin-top: 0.5rem; font-size: 0.9rem; color: #20B2AA;">
                    ✅ ${isVideo ? 'Video' : 'Image'} ready: ${formatFileSize(finalSize)}
                </p>`;
            
            uploadArea.innerHTML = `
                <input type="file" id="image" name="image" accept="image/*,video/*" style="display: none;">
                ${mediaElement}
                ${compressionText}
                <p style="margin: 0; font-size: 0.8rem; color: #CCCCCC;">Click to change ${isVideo ? 'video' : 'image'}</p>
            `;
            
            initFileUploadHandlers();
            currentCompressedFile = file;
            replaceFileInput(file);
        }
        
        // Initialize handlers on page load
        initFileUploadHandlers();
        
        // Image compression function for blockchain optimization
        function compressImage(file, callback) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                // For blockchain storage, try to keep under 1MB but allow up to 2MB for high quality
                const targetSizes = [1024, 512, 256]; // Max dimensions to try
                const qualities = [0.9, 0.7, 0.5, 0.3]; // Quality levels to try
                const maxFileSize = 2 * 1024 * 1024; // 2MB limit for final file
                
                let sizeIndex = 0;
                let qualityIndex = 0;
                
                function tryCompress() {
                    // Calculate optimal dimensions
                    let { width, height } = calculateOptimalSize(img.width, img.height, targetSizes[sizeIndex]);
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // Clear and draw
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to blob
                    canvas.toBlob(function(blob) {
                        if (blob.size <= maxFileSize) {
                            // Success - under 2MB limit
                            callback(new File([blob], file.name, { type: 'image/jpeg' }), file.size, blob.size, true);
                        } else {
                            // Still too large, try next quality level
                            qualityIndex++;
                            if (qualityIndex < qualities.length) {
                                tryCompress();
                            } else {
                                // Try smaller dimensions
                                qualityIndex = 0;
                                sizeIndex++;
                                if (sizeIndex < targetSizes.length) {
                                    tryCompress();
                                } else {
                                    // Use the last attempt even if over limit
                                    callback(new File([blob], file.name, { type: 'image/jpeg' }), file.size, blob.size, true);
                                }
                            }
                        }
                    }, 'image/jpeg', qualities[qualityIndex]);
                }
                
                tryCompress();
            };
            
            img.onerror = function() {
                callback(null, file.size, 0, false);
            };
            
            img.src = URL.createObjectURL(file);
        }
        
        // Calculate optimal image size for blockchain storage
        function calculateOptimalSize(width, height, maxSize) {
            if (width <= maxSize && height <= maxSize) {
                return { width, height };
            }
            
            const ratio = Math.min(maxSize / width, maxSize / height);
            return {
                width: Math.floor(width * ratio),
                height: Math.floor(height * ratio)
            };
        }
        
        // Format file size for display
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        
        // Replace file input with compressed file
        function replaceFileInput(compressedFile) {
            const input = document.getElementById('image');
            const dt = new DataTransfer();
            dt.items.add(compressedFile);
            input.files = dt.files;
        }
        
        // Form submission validation
        document.querySelector('.create-form').addEventListener('submit', function(e) {
            // Basic validation - files are already validated during upload
            const name = document.getElementById('name').value.trim();
            const symbol = document.getElementById('symbol').value.trim();
            
            if (!name || !symbol) {
                e.preventDefault();
                alert('⚠️ Please fill in the coin name and ticker.');
                return false;
            }
        });
        
        // Auto-uppercase symbol input
        document.getElementById('symbol').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });
        
        console.log('🚀 Token creation page loaded successfully!');
</script>

{% extends "app/base_layout.html" %}

{% block title %}Create Token - Gemlaunch.fun{% endblock %}

{% block extra_head %}
<!-- Quill.js Rich Text Editor -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<style>
        .create-main {
            padding-top: 100px;
            min-height: 100vh;
        }
        
        .create-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .create-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .create-header h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #20B2AA, #00CED1, #40E0D0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .mode-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 0.5rem;
        }
        
        .mode-option {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #CCCCCC;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .mode-option.active {
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            font-weight: 600;
        }
        
        .mode-option h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
        }
        
        .mode-option p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .create-form {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.2);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
        }
        
        /* Simple immutability note */
        .immutable-note {
            margin: 1.5rem 0 1rem 0;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #CCCCCC;
            text-align: center;
        }
        
        .immutable-note i {
            color: #20B2AA;
            margin-right: 0.5rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .image-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            border: 2px dashed rgba(32, 178, 170, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .image-upload:hover {
            border-color: #20B2AA;
            background: rgba(32, 178, 170, 0.05);
        }
        
        .image-upload input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .upload-icon {
            font-size: 2rem;
            color: #20B2AA;
            margin-bottom: 0.5rem;
        }
        
        /* Rich Text Editor Styling */
        .description-editor {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            min-height: 120px;
            transition: all 0.3s ease;
        }
        
        .description-editor:focus-within {
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid rgba(32, 178, 170, 0.2) !important;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px 8px 0 0;
        }
        
        .ql-container {
            border: none !important;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif !important;
            font-size: 1rem;
            border-radius: 0 0 8px 8px;
        }
        
        .ql-editor {
            min-height: 80px;
            padding: 1rem;
            color: #FFFFFF !important;
            font-family: 'Inter', sans-serif !important;
        }
        
        .ql-editor.ql-blank::before {
            color: rgba(255, 255, 255, 0.5) !important;
            font-style: normal;
        }
        
        .ql-snow .ql-stroke {
            stroke: #CCCCCC;
        }
        
        .ql-snow .ql-fill {
            fill: #CCCCCC;
        }
        
        .ql-snow .ql-picker {
            color: #CCCCCC;
        }
        
        .ql-snow .ql-picker-options {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(32, 178, 170, 0.3);
        }
        
        .ql-snow .ql-picker-item:hover {
            background: rgba(32, 178, 170, 0.2);
        }
        
        /* Social Links Styling */
        .social-links-header {
            cursor: pointer;
            padding: 0.5rem 0;
        }
        
        .social-links-content {
            border-top: 1px solid rgba(32, 178, 170, 0.2);
            padding-top: 1rem;
        }
        
        .social-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .supply-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .supply-info h4 {
            color: #20B2AA;
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
        }
        
        .supply-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #CCCCCC;
            line-height: 1.5;
        }
        
        .range-input {
            width: 100%;
            margin: 1rem 0;
        }
        
        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #CCCCCC;
            margin-bottom: 0.5rem;
        }
        
        .advanced-section {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(32, 178, 170, 0.2);
        }
        
        .advanced-section.active {
            display: block;
        }
        
        .create-btn {
            width: 100%;
            background: linear-gradient(135deg, #20B2AA, #00CED1);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }
        
        .create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(32, 178, 170, 0.4);
        }
        
        .create-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* File size info styling */
        .file-size-info {
            background: rgba(32, 178, 170, 0.1);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #20B2AA;
        }
        
        /* Add textarea styling to match other inputs */
        .form-group textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(32, 178, 170, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group textarea:focus {
            outline: none;
            border-color: #20B2AA;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(32, 178, 170, 0.1);
        }
        
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Inter', sans-serif;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .mode-selector {
                flex-direction: column;
            }
            
            .create-header h1 {
                font-size: 2rem;
            }
            
            .image-upload {
                min-height: 100px;
            }
            
            .ql-editor {
                min-height: 60px;
            }
        }
{% endblock %}

{% block content %}
            <div class="create-container">
                <div class="create-header">
                    <h1>Create Your Memecoin</h1>
                    <p>Launch a community-driven token on Kaspa with fair bonding curve mechanics</p>
                </div>

                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% for category, message in messages %}
                                <div class="flash-message flash-{{ category }}">
                                    <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-triangle' if category == 'error' else 'info-circle' }}"></i>
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <!-- Mode Selector -->
                <div class="mode-selector">
                    <button class="mode-option active" onclick="setMode('simple')">
                        <h3>🚀 Simple Mode</h3>
                        <p>Quick launch with 1B tokens</p>
                    </button>
                    <button class="mode-option" onclick="setMode('advanced')">
                        <h3>⚙️ Advanced Mode</h3>
                        <p>Custom supply & reserves</p>
                    </button>
                </div>

                <!-- Create Form -->
                <form method="POST" enctype="multipart/form-data" class="create-form">
                    <input type="hidden" name="mode" id="mode" value="simple">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Token Name *</label>
                            <input type="text" id="name" name="name" required placeholder="e.g., My Awesome Coin">
                        </div>
                        <div class="form-group">
                            <label for="symbol">Symbol *</label>
                            <input type="text" id="symbol" name="symbol" required placeholder="e.g., MAC" maxlength="10" style="text-transform: uppercase;">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description (Optional)</label>
                        <div class="description-editor" id="description-editor"></div>
                        <input type="hidden" id="description" name="description">
                    </div>

                    <div class="form-group full-width">
                        <label>Token Image</label>
                        <div class="image-upload" onclick="document.getElementById('image').click()">
                            <input type="file" id="image" name="image" accept="image/*">
                            <i class="fas fa-cloud-upload-alt upload-icon"></i>
                            <h4>Upload Token Image</h4>
                            <p>PNG, JPG, GIF up to 500KB (optimized for blockchain)</p>
                            <small style="color: #CCCCCC; font-size: 0.75rem;">Minimum 1000x1000px, 1:1 square recommended</small>
                        </div>
                    </div>

                    <!-- Social Links Section -->
                    <div class="form-group full-width">
                        <div class="social-links-header" onclick="toggleSocialLinks()">
                            <label style="margin: 0; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                                <span>Add social links (Optional)</span>
                                <i class="fas fa-chevron-down" id="social-chevron" style="transition: transform 0.3s ease; font-size: 0.8rem;"></i>
                            </label>
                        </div>
                        <div class="social-links-content" id="social-links-content" style="display: none; margin-top: 1rem;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="website">
                                        <i class="fas fa-globe" style="margin-right: 0.5rem; color: #20B2AA;"></i>
                                        Website
                                    </label>
                                    <input type="url" id="website" name="website" placeholder="https://yourwebsite.com">
                                </div>
                                <div class="form-group">
                                    <label for="twitter">
                                        <i class="fab fa-twitter" style="margin-right: 0.5rem; color: #20B2AA;"></i>
                                        X (Twitter)
                                    </label>
                                    <input type="url" id="twitter" name="twitter" placeholder="https://x.com/yourusername">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="telegram">
                                        <i class="fab fa-telegram" style="margin-right: 0.5rem; color: #20B2AA;"></i>
                                        Telegram
                                    </label>
                                    <input type="url" id="telegram" name="telegram" placeholder="https://t.me/yourchannel">
                                </div>
                                <div class="form-group">
                                    <!-- Empty column for layout balance -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Advanced Options -->
                    <div class="advanced-section" id="advanced-options">
                        <h3 style="color: #20B2AA; margin-bottom: 1rem;">Advanced Configuration</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="total_supply">Total Supply</label>
                                <input type="number" id="total_supply" name="total_supply" value="1000000000" min="1000000" max="100000000000" step="1000000">
                                <div class="supply-info">
                                    <h4>💡 Supply Guidelines</h4>
                                    <p>Most successful memecoins use 1B tokens. Lower supply = higher individual token price, higher supply = lower price with more decimal places.</p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="reserved_percentage">Reserved Tokens (%)</label>
                                <div class="range-labels">
                                    <span>0%</span>
                                    <span id="reserve-display">0%</span>
                                    <span>25%</span>
                                </div>
                                <input type="range" id="reserved_percentage" name="reserved_percentage" min="0" max="25" value="0" class="range-input" oninput="updateReserveDisplay(this.value)">
                                <div class="supply-info">
                                    <h4>🔒 Reserved Tokens</h4>
                                    <p>Keep up to 25% of tokens for team, marketing, partnerships, or future development. Reserved tokens are locked until manually deployed.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Simple immutability note -->
                    <p class="immutable-note">
                        <i class="fas fa-info-circle"></i>
                        Note: All token details become permanent once deployed and cannot be changed.
                    </p>
                    
                    <button type="submit" class="create-btn">
                        <i class="fas fa-rocket"></i>
                        Launch Token ($0 - Fair Launch)
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
        // Initialize Rich Text Editor
        let quill = new Quill('#description-editor', {
            theme: 'snow',
            placeholder: 'Tell the community about your token... 🚀💎🌟',
            modules: {
                toolbar: [
                    [{ 'header': [3, 4, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link'],
                    ['clean']
                ]
            }
        });
        
        // Update hidden input when content changes
        quill.on('text-change', function() {
            document.getElementById('description').value = quill.root.innerHTML;
        });
        
        // Emoji insertion helper
        function insertEmoji(emoji) {
            const range = quill.getSelection();
            if (range) {
                quill.insertText(range.index, emoji);
            } else {
                quill.insertText(quill.getLength() - 1, emoji);
            }
        }
        
        function setMode(mode) {
            // Update mode selector
            document.querySelectorAll('.mode-option').forEach(option => {
                option.classList.remove('active');
            });
            event.target.closest('.mode-option').classList.add('active');
            
            // Update hidden input
            document.getElementById('mode').value = mode;
            
            // Show/hide advanced options
            const advancedSection = document.getElementById('advanced-options');
            if (mode === 'advanced') {
                advancedSection.classList.add('active');
            } else {
                advancedSection.classList.remove('active');
            }
        }
        
        function updateReserveDisplay(value) {
            document.getElementById('reserve-display').textContent = value + '%';
        }
        
        // Global variable to track compressed file
        let currentCompressedFile = null;
        
        // Initialize image upload handler
        function initImageUploadHandler() {
            const imageInput = document.getElementById('image');
            if (imageInput) {
                imageInput.addEventListener('change', handleImageUpload);
            }
        }
        
        // Image upload handler with compression and validation
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                // Validate file size (initial check)
                if (file.size > 10 * 1024 * 1024) { // 10MB initial limit
                    alert('⚠️ Image too large! Please select an image under 10MB.');
                    e.target.value = '';
                    return;
                }
                
                // Validate file type
                if (!file.type.startsWith('image/')) {
                    alert('⚠️ Please select a valid image file (PNG, JPG, GIF, WebP)');
                    e.target.value = '';
                    return;
                }
                
                // Show compression progress
                const uploadArea = document.querySelector('.image-upload');
                uploadArea.innerHTML = `
                    <input type="file" id="image" name="image" accept="image/*">
                    <i class="fas fa-spinner fa-spin upload-icon"></i>
                    <h4>Compressing for blockchain...</h4>
                    <p>Optimizing image size</p>
                `;
                
                // Re-attach event listener to new input
                initImageUploadHandler();
                
                // Validate image dimensions first
                validateImageDimensions(file, function(isValid, errorMessage) {
                    if (!isValid) {
                        uploadArea.innerHTML = `
                            <input type="file" id="image" name="image" accept="image/*">
                            <i class="fas fa-exclamation-triangle upload-icon" style="color: #FF6B6B;"></i>
                            <h4 style="color: #FF6B6B;">Image Requirements Not Met</h4>
                            <p>${errorMessage}</p>
                            <p style="font-size: 0.8rem; color: #CCCCCC;">Upload a larger image (min 1000x1000px)</p>
                        `;
                        initImageUploadHandler();
                        return;
                    }
                    
                    // Warn about format conversion if PNG
                    if (file.type === 'image/png') {
                        console.log('ℹ️ PNG will be converted to JPEG for blockchain optimization. Transparency will be lost.');
                    }
                    
                    // Proceed with compression
                    compressImage(file, function(compressedFile, originalSize, compressedSize, success) {
                    if (!success) {
                        // Compression failed - file too large
                        currentCompressedFile = null; // Clear stale reference
                        uploadArea.innerHTML = `
                            <input type="file" id="image" name="image" accept="image/*">
                            <i class="fas fa-exclamation-triangle upload-icon" style="color: #FF6B6B;"></i>
                            <h4 style="color: #FF6B6B;">Image Too Large</h4>
                            <p>Unable to compress below 500KB limit for blockchain storage</p>
                            <p style="font-size: 0.8rem; color: #CCCCCC;">Try a smaller or simpler image</p>
                        `;
                        initImageUploadHandler();
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadArea.innerHTML = `
                            <input type="file" id="image" name="image" accept="image/*">
                            <img src="${e.target.result}" style="max-width: 80px; max-height: 80px; border-radius: 10px; object-fit: cover;">
                            <p style="margin-top: 0.5rem; font-size: 0.9rem; color: #20B2AA;">
                                ✅ Optimized: ${formatFileSize(originalSize)} → ${formatFileSize(compressedSize)}
                            </p>
                            <p style="margin: 0; font-size: 0.8rem; color: #CCCCCC;">Click to change image</p>
                        `;
                        
                        // Re-attach event listener and store compressed file
                        initImageUploadHandler();
                        currentCompressedFile = compressedFile;
                        replaceFileInput(compressedFile);
                    };
                    reader.readAsDataURL(compressedFile);
                    });
                });
            }
        }
        
        // Initialize handler on page load
        initImageUploadHandler();
        
        // Social links toggle functionality
        function toggleSocialLinks() {
            const content = document.getElementById('social-links-content');
            const chevron = document.getElementById('social-chevron');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                chevron.style.transform = 'rotate(180deg)';
            } else {
                content.style.display = 'none';
                chevron.style.transform = 'rotate(0deg)';
            }
        }
        
        // Image dimension validation
        function validateImageDimensions(file, callback) {
            const img = new Image();
            img.onload = function() {
                if (img.width < 1000 || img.height < 1000) {
                    callback(false, `Image too small: ${img.width}x${img.height}px. Minimum 1000x1000px required.`);
                } else {
                    callback(true, '');
                }
            };
            img.onerror = function() {
                callback(false, 'Invalid image file');
            };
            img.src = URL.createObjectURL(file);
        }
        
        // Image compression function for blockchain optimization
        function compressImage(file, callback) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                // Try progressively smaller sizes if needed
                const maxSizes = [512, 256, 128]; // Max dimensions to try
                const qualities = [0.8, 0.6, 0.4, 0.2]; // Quality levels to try
                
                let sizeIndex = 0;
                let qualityIndex = 0;
                
                function tryCompress() {
                    // Calculate optimal dimensions
                    let { width, height } = calculateOptimalSize(img.width, img.height, maxSizes[sizeIndex]);
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // Clear and draw
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to blob
                    canvas.toBlob(function(blob) {
                        if (blob.size <= 500 * 1024) {
                            // Success - under 500KB limit
                            callback(new File([blob], file.name, { type: 'image/jpeg' }), file.size, blob.size, true);
                        } else {
                            // Still too large, try next quality level
                            qualityIndex++;
                            if (qualityIndex < qualities.length) {
                                tryCompress();
                            } else {
                                // Try smaller dimensions
                                qualityIndex = 0;
                                sizeIndex++;
                                if (sizeIndex < maxSizes.length) {
                                    tryCompress();
                                } else {
                                    // Failed to compress below limit
                                    callback(null, file.size, blob.size, false);
                                }
                            }
                        }
                    }, 'image/jpeg', qualities[qualityIndex]);
                }
                
                tryCompress();
            };
            
            img.onerror = function() {
                callback(null, file.size, 0, false);
            };
            
            img.src = URL.createObjectURL(file);
        }
        
        // Calculate optimal image size for blockchain storage
        function calculateOptimalSize(width, height, maxSize) {
            if (width <= maxSize && height <= maxSize) {
                return { width, height };
            }
            
            const ratio = Math.min(maxSize / width, maxSize / height);
            return {
                width: Math.floor(width * ratio),
                height: Math.floor(height * ratio)
            };
        }
        
        // Format file size for display
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        
        // Replace file input with compressed file
        function replaceFileInput(compressedFile) {
            const input = document.getElementById('image');
            const dt = new DataTransfer();
            dt.items.add(compressedFile);
            input.files = dt.files;
        }
        
        // Form submission validation
        document.querySelector('.create-form').addEventListener('submit', function(e) {
            if (currentCompressedFile && currentCompressedFile.size > 500 * 1024) {
                e.preventDefault();
                alert('⚠️ Image file is still too large for blockchain storage. Please select a smaller image.');
                return false;
            }
        });
        
        // Auto-uppercase symbol input
        document.getElementById('symbol').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });
</script>
{% endblock %}
